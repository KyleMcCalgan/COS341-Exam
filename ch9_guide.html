<header><h1>COS341 · Chapter 9</h1><span class="sub">The call sequence versus inlining: algorithms, two worked examples, edge cases</span><span class="spacer"></span><button class="quiet themebtn" onclick="toggleTheme()">Light / dark</button></header>
<div class="layout"><nav></nav><main></main></div>
<script>
"use strict";
/* ============================================================
   Helpers
   ============================================================ */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtSet=a=>{a=[...a].sort((x,y)=>x.localeCompare(y,undefined,{numeric:true}));return a.length?'{'+a.map(esc).join(', ')+'}':'∅'};
const iv=(n,s)=>`<i>${n}${s?`<sub>${s}</sub>`:''}</i>`;
const T_EXP='<i>Trans<sub>Exp</sub></i>',T_EXPS='<i>Trans<sub>Exps</sub></i>',T_STAT='<i>Trans<sub>Stat</sub></i>',T_COND='<i>Trans<sub>Cond</sub></i>';
const VF=`${iv('vtable')}, ${iv('ftable')}`;

/* ============================================================
   The textbook's recursive tables, line for line
   (Fig 6.3 TransExp + TransExps, Fig 6.5 TransStat, Fig 6.6 and Fig 6.8 TransCond)
   ============================================================ */
const TB={
 Exp:{fig:'6.3',title:`${T_EXP}(${iv('Exp')}, ${VF}, ${iv('place')}) = case ${iv('Exp')} of`,rows:[
  {key:'e_num',pat:'<b>num</b>',lines:[
    `${iv('v')} = ${iv('getvalue')}(<b>num</b>)`,
    `[${iv('place')} := ${iv('v')}]`]},
  {key:'e_id',pat:'<b>id</b>',lines:[
    `${iv('x')} = ${iv('lookup')}(${iv('vtable')}, ${iv('getname')}(<b>id</b>))`,
    `[${iv('place')} := ${iv('x')}]`]},
  {key:'e_unop',pat:`<b>unop</b> ${iv('Exp',1)}`,lines:[
    `${iv('place',1)} = ${iv('newvar')}()`,
    `${iv('code',1)} = ${T_EXP}(${iv('Exp',1)}, ${VF}, ${iv('place',1)})`,
    `${iv('op')} = ${iv('transop')}(${iv('getopname')}(<b>unop</b>))`,
    `${iv('code',1)} ++ [${iv('place')} := ${iv('op')} ${iv('place',1)}]`]},
  {key:'e_binop',pat:`${iv('Exp',1)} <b>binop</b> ${iv('Exp',2)}`,lines:[
    `${iv('place',1)} = ${iv('newvar')}()`,
    `${iv('place',2)} = ${iv('newvar')}()`,
    `${iv('code',1)} = ${T_EXP}(${iv('Exp',1)}, ${VF}, ${iv('place',1)})`,
    `${iv('code',2)} = ${T_EXP}(${iv('Exp',2)}, ${VF}, ${iv('place',2)})`,
    `${iv('op')} = ${iv('transop')}(${iv('getopname')}(<b>binop</b>))`,
    `${iv('code',1)} ++ ${iv('code',2)} ++ [${iv('place')} := ${iv('place',1)} ${iv('op')} ${iv('place',2)}]`]},
  {key:'e_call',pat:`<b>id</b>(${iv('Exps')})`,lines:[
    `(${iv('code',1)}, [${iv('a',1)},...,${iv('a','n')}]) = ${T_EXPS}(${iv('Exps')}, ${VF})`,
    `${iv('fname')} = ${iv('lookup')}(${iv('ftable')}, ${iv('getname')}(<b>id</b>))`,
    `${iv('code',1)} ++ [${iv('place')} := CALL ${iv('fname')}(${iv('a',1)},...,${iv('a','n')})]`]},
  {key:'e_true',fig:'6.8',pat:'true',lines:[`[${iv('place')} := 1]`]},
  {key:'e_false',fig:'6.8',pat:'false',lines:[`[${iv('place')} := 0]`]},
  {key:'e_cond',fig:'6.8',pat:iv('Cond'),lines:[
    `${iv('label',1)} = ${iv('newlabel')}()`,
    `${iv('label',2)} = ${iv('newlabel')}()`,
    `${iv('code',1)} = ${T_COND}(${iv('Cond')}, ${iv('label',1)}, ${iv('label',2)}, ${VF})`,
    `[${iv('place')} := 0] ++ ${iv('code',1)}<br>&nbsp;&nbsp;&nbsp;++ [LABEL ${iv('label',1)}, ${iv('place')} := 1]<br>&nbsp;&nbsp;&nbsp;++ [LABEL ${iv('label',2)}]`]}
 ]},
 Exps:{fig:'6.3',title:`${T_EXPS}(${iv('Exps')}, ${VF}) = case ${iv('Exps')} of`,rows:[
  {key:'exps_one',pat:iv('Exp'),lines:[
    `${iv('place')} = ${iv('newvar')}()`,
    `${iv('code',1)} = ${T_EXP}(${iv('Exp')}, ${VF}, ${iv('place')})`,
    `(${iv('code',1)}, [${iv('place')}])`]},
  {key:'exps_more',pat:`${iv('Exp')} , ${iv('Exps')}`,lines:[
    `${iv('place')} = ${iv('newvar')}()`,
    `${iv('code',1)} = ${T_EXP}(${iv('Exp')}, ${VF}, ${iv('place')})`,
    `(${iv('code',2)}, ${iv('args')}) = ${T_EXPS}(${iv('Exps')}, ${VF})`,
    `${iv('code',3)} = ${iv('code',1)} ++ ${iv('code',2)}`,
    `${iv('args',1)} = ${iv('place')} :: ${iv('args')}`,
    `(${iv('code',3)}, ${iv('args',1)})`]}
 ]},
 Stat:{fig:'6.5',title:`${T_STAT}(${iv('Stat')}, ${VF}) = case ${iv('Stat')} of`,rows:[
  {key:'s_seq',pat:`${iv('Stat',1)} ; ${iv('Stat',2)}`,lines:[
    `${iv('code',1)} = ${T_STAT}(${iv('Stat',1)}, ${VF})`,
    `${iv('code',2)} = ${T_STAT}(${iv('Stat',2)}, ${VF})`,
    `${iv('code',1)} ++ ${iv('code',2)}`]},
  {key:'s_assign',pat:`<b>id</b> := ${iv('Exp')}`,lines:[
    `${iv('place')} = ${iv('newvar')}()`,
    `${iv('x')} = ${iv('lookup')}(${iv('vtable')}, ${iv('getname')}(<b>id</b>))`,
    `${T_EXP}(${iv('Exp')}, ${VF}, ${iv('place')}) ++ [${iv('x')} := ${iv('place')}]`]},
  {key:'s_if',pat:`<code>if</code> ${iv('Cond')}<br><code>then</code> ${iv('Stat',1)}`,lines:[
    `${iv('label',1)} = ${iv('newlabel')}()`,

let NID=0;
const mk=o=>{o.id=NID++;return o};
const E_num=v=>mk({k:'e_num',v}),E_id=name=>mk({k:'e_id',name}),E_un=(op,e)=>mk({k:'e_unop',op,e}),
  E_bin=(op,l,r)=>mk({k:'e_binop',op,l,r}),E_call=(f,args)=>mk({k:'e_call',f,args});
const S_seq=(a,b)=>mk({k:'s_seq',a,b}),S_asg=(nm,e)=>mk({k:'s_assign',nm,e}),S_wh=(c,s)=>mk({k:'s_while',c,s}),S_rep=(s,c)=>mk({k:'s_repeat',s,c});
const C_rel=(op,l,r)=>mk({k:'c_rel',op,l,r}),C_and=(a,b)=>mk({k:'c_and',a,b}),C_or=(a,b)=>mk({k:'c_or',a,b}),C_not=c=>mk({k:'c_not',c});
function src(n){
  switch(n.k){
   case 'e_num':return String(n.v);case 'e_id':return n.name;
   case 'e_unop':return n.op+src(n.e);
   case 'e_binop':return src(n.l)+' '+n.op+' '+src(n.r);
   case 'e_call':return n.f+'('+n.args.map(src).join(', ')+')';
   case 'c_rel':return src(n.l)+' '+n.op+' '+src(n.r);
   case 'c_not':return '!('+src(n.c)+')';
   case 'c_and':return '('+src(n.a)+') && ('+src(n.b)+')';
   case 'c_or':return '('+src(n.a)+') || ('+src(n.b)+')';
   case 's_assign':return n.nm+' := '+src(n.e);
   case 's_seq':return src(n.a)+'; '+src(n.b);
   case 's_while':return 'while ('+src(n.c)+') do { '+src(n.s)+' }';
   case 's_repeat':return 'repeat { '+src(n.s)+' } until ('+src(n.c)+')';
  }
  return '?';
}

/* ============================================================
   The engine: runs the textbook recursion and records everything
   ============================================================ */
function codeTxt(lines){return lines.length?'['+lines.map(esc).join(', ')+']':'[ ]'}
function translate(P,start){
  const ast=P.build();
  let tn=start.t,ln=start.l,RID=0;
  const EV=[];
  const nv=()=>'t'+(tn++),nl=()=>'L'+(ln++);
  const vt=P.vt,ft=P.ft;
  const newR=(fn,key,node,desc,params,parent)=>{
    const r={id:RID++,fn,key,node,desc,params,parent,inst:[],children:[],comp:[],code:[],args:null,allocs:[],enterAt:-1,retAt:-1,in:{}};
    if(parent)parent.children.push(r);return r};
  const enter=r=>{r.enterAt=EV.length;EV.push({t:'e',r})};
  const I=(r,txt,kind)=>{r.inst.push({at:EV.length,kind:kind||'plain',pend:txt,done:txt,doneAt:EV.length});};
  const alloc=(r,lhs,val)=>{r.allocs.push(val);I(r,`${lhs} = ${lhs.startsWith('label')||lhs==='arg2'?'newlabel':'newvar'}() = <b>${val}</b>`,'alloc');return val};
  const callLine=(r,lhs,callTxt,fnChild,isPair)=>{
    const e={at:EV.length,kind:'call',pend:`${lhs} = ${callTxt}`,done:null,doneAt:1e9};
    r.inst.push(e);const ch=fnChild();
    e.doneAt=ch.retAt;
    e.done=isPair?`${lhs} = (${codeTxt(ch.code)}, [${ch.args.join(', ')}])`:`${lhs} = ${codeTxt(ch.code)}`;
    e.child=ch;return ch};
  const fin=(r,comp,names)=>{
    r.comp=comp;r.code=[];
    comp.forEach(p=>{if(p.child)r.code.push(...p.child.code);else r.code.push(...p.lines)});
    r.retAt=EV.length+1;EV.push({t:'r',r});
    const txt=comp.map(p=>p.child?esc(p.nm):codeTxt(p.lines)).join(' ++ ');
    r.ret={at:r.retAt,txt,code:r.code,args:r.args};
    if(!r.noRet)r.inst.push({at:r.retAt,kind:'ret',pend:txt,done:txt,doneAt:r.retAt});
    return r};
  const lk=(m,n)=>m[n]===undefined?n:m[n];
  /* ---------- TransExp ---------- */
  function Exp(n,place,parent){
    const r=newR('Exp',n.k,n,src(n),`place = ${place}`,parent);enter(r);
    switch(n.k){
     case 'e_num':
      I(r,`v = getvalue(num) = ${n.v}`);
      return fin(r,[{lines:[`${place} := ${n.v}`]}]);
     case 'e_id':{
      const x=lk(vt,n.name);I(r,`x = lookup(vtable, "${esc(n.name)}") = <b>${x}</b>`);
      return fin(r,[{lines:[`${place} := ${x}`]}]);}
     case 'e_unop':{
      const p1=alloc(r,'place₁',nv());
      const c1=callLine(r,'code₁',`TransExp(${esc(src(n.e))}, vtable, ftable, ${p1})`,()=>Exp(n.e,p1,r));
      I(r,`op = transop("${n.op}") = ${n.op}`);
      return fin(r,[{child:c1,nm:'code₁'},{lines:[`${place} := ${n.op} ${p1}`]}]);}
     case 'e_binop':{
      const p1=alloc(r,'place₁',nv()),p2=alloc(r,'place₂',nv());
      const c1=callLine(r,'code₁',`TransExp(${esc(src(n.l))}, vtable, ftable, ${p1})`,()=>Exp(n.l,p1,r));
      const c2=callLine(r,'code₂',`TransExp(${esc(src(n.r))}, vtable, ftable, ${p2})`,()=>Exp(n.r,p2,r));
      I(r,`op = transop("${n.op}") = ${n.op}`);
      return fin(r,[{child:c1,nm:'code₁'},{child:c2,nm:'code₂'},{lines:[`${place} := ${p1} ${n.op} ${p2}`]}]);}
     case 'e_call':{
      const c1=callLine(r,'(code₁, [a₁,…,aₙ])',`TransExps(${esc(n.args.map(src).join(', '))}, vtable, ftable)`,()=>Exps(n.args,r),true);
      const f=lk(ft,n.f);I(r,`fname = lookup(ftable, "${n.f}") = <b>${f}</b>`);
      return fin(r,[{child:c1,nm:'code₁'},{lines:[`${place} := CALL ${f}(${c1.args.join(', ')})`]}]);}
    }}
  /* ---------- TransExps ---------- */
  function Exps(list,parent){
    const one=list.length===1;
    const r=newR('Exps',one?'exps_one':'exps_more',null,list.map(src).join(', '),'',parent);r.list=list;enter(r);
    const place=alloc(r,'place',nv());
    const c1=callLine(r,'code₁',`TransExp(${esc(src(list[0]))}, vtable, ftable, ${place})`,()=>Exp(list[0],place,r));
    if(one){r.args=[place];
      r.inst.push({at:EV.length+1,kind:'ret',pend:`(${codeTxt(c1.code)}, [${place}])`,done:`(${codeTxt(c1.code)}, [${place}])`,doneAt:0});
      r.comp=[{child:c1,nm:'code₁'}];r.code=[...c1.code];r.retAt=EV.length+1;EV.push({t:'r',r});
      r.inst[r.inst.length-1].at=r.retAt;r.inst[r.inst.length-1].doneAt=r.retAt;return r}
    const c2=callLine(r,'(code₂, args)',`TransExps(${esc(list.slice(1).map(src).join(', '))}, vtable, ftable)`,()=>Exps(list.slice(1),r),true);
    const code3=[...c1.code,...c2.code];
    I(r,`code₃ = code₁ ++ code₂ = ${codeTxt(code3)}`);
    r.args=[place,...c2.args];
    I(r,`args₁ = place :: args = [${r.args.join(', ')}]`);
    r.comp=[{child:c1,nm:'code₁'},{child:c2,nm:'code₂'}];r.code=code3;
    r.retAt=EV.length+1;EV.push({t:'r',r});
    r.inst.push({at:r.retAt,kind:'ret',pend:`(${codeTxt(code3)}, [${r.args.join(', ')}])`,done:`(${codeTxt(code3)}, [${r.args.join(', ')}])`,doneAt:r.retAt});

  function Stat(n,parent){

     case 's_seq':{

      const c2=callLine(r,'code₂',`TransStat(${esc(src(n.b))}, vtable, ftable)`,()=>Stat(n.b,r));
      return fin(r,[{child:c1,nm:'code₁'},{child:c2,nm:'code₂'}]);}
     case 's_assign':{
      const place=alloc(r,'place',nv());
      const x=lk(vt,n.nm);I(r,`x = lookup(vtable, "${n.nm}") = <b>${x}</b>`);
      r.noRet=true;const e={at:EV.length,kind:'call',pend:`TransExp(${esc(src(n.e))}, vtable, ftable, ${place}) ++ [${x} := ${place}]`,done:null,doneAt:1e9};
      r.inst.push(e);
      const ch=Exp(n.e,place,r);
      const res=fin(r,[{child:ch,nm:'TransExp(…)'},{lines:[`${x} := ${place}`]}]);
      e.done=codeTxt(r.code);e.doneAt=r.retAt;return res;}
     case 's_while':{
      const l1=alloc(r,'label₁',nl()),l2=alloc(r,'label₂',nl()),l3=alloc(r,'label₃',nl());
      const c1=callLine(r,'code₁',`TransCond(${esc(src(n.c))}, ${l2}, ${l3}, vtable, ftable)`,()=>Cond(n.c,l2,l3,r));
      const c2=callLine(r,'code₂',`TransStat(${esc(src(n.s))}, vtable, ftable)`,()=>Stat(n.s,r));
      return fin(r,[{lines:['LABEL '+l1]},{child:c1,nm:'code₁'},{lines:['LABEL '+l2]},{child:c2,nm:'code₂'},{lines:['GOTO '+l1,'LABEL '+l3]}]);}
     case 's_repeat':{
      const l1=alloc(r,'label₁',nl()),l2=alloc(r,'label₂',nl());
      const c1=callLine(r,'code₁',`TransStat(${esc(src(n.s))}, vtable, ftable)`,()=>Stat(n.s,r));
      const c2=callLine(r,'code₂',`TransCond(${esc(src(n.c))}, ${l2}, ${l1}, vtable, ftable)`,()=>Cond(n.c,l2,l1,r));
      return fin(r,[{lines:['LABEL '+l1]},{child:c1,nm:'code₁'},{child:c2,nm:'code₂'},{lines:['LABEL '+l2]}]);}
    }}
  /* ---------- TransCond ---------- */
  function Cond(n,lt,lf,parent){
    const r=newR('Cond',n.k,n,src(n),`Lt = ${lt}, Lf = ${lf}`,parent);enter(r);
    switch(n.k){
     case 'c_rel':{
      const t1=alloc(r,'t₁',nv()),t2=alloc(r,'t₂',nv());
      const c1=callLine(r,'code₁',`TransExp(${esc(src(n.l))}, vtable, ftable, ${t1})`,()=>Exp(n.l,t1,r));
      const c2=callLine(r,'code₂',`TransExp(${esc(src(n.r))}, vtable, ftable, ${t2})`,()=>Exp(n.r,t2,r));
      I(r,`op = transop("${n.op}") = ${n.op}`);
      return fin(r,[{child:c1,nm:'code₁'},{child:c2,nm:'code₂'},{lines:[`IF ${t1} ${n.op} ${t2} THEN ${lt} ELSE ${lf}`]}]);}
     case 'c_not':{
      r.noRet=true;const e={at:EV.length,kind:'call',pend:`TransCond(${esc(src(n.c))}, <b>${lf}</b>, <b>${lt}</b>, vtable, ftable)`,done:null,doneAt:1e9};

     case 'c_and':{

      const c2=callLine(r,'code₂',`TransCond(${esc(src(n.b))}, ${lt}, ${lf}, vtable, ftable)`,()=>Cond(n.b,lt,lf,r));

      const c2=callLine(r,'code₂',`TransCond(${esc(src(n.b))}, ${lt}, ${lf}, vtable, ftable)`,()=>Cond(n.b,lt,lf,r));

function inlinePlan(mainCode,bodyCode,params,retVar,fname,startT,startL,startU){

function runMachine(code,opts){

  const addr=s=>{const m=/^M\[SP(?:\+(\d+))?\]$/.exec(s);return m?SP+(m[1]?+m[1]:0):null};
  const ops={'+':(a,b)=>a+b,'-':(a,b)=>a-b,'*':(a,b)=>a*b,'>':(a,b)=>a>b,'<':(a,b)=>a<b,'=':(a,b)=>a===b};
  let pc=0,steps=0;const snap={};
  let last=-1;
  const shot=()=>{if(opts.trace&&last>=0&&snap[last]===null)snap[last]={SP,V:{...V},M:{...M}}};
  while(pc<code.length&&steps++<5000){
    shot();
    const l=code[pc];let m;const cur=pc;last=cur;pc++;
    if(opts.trace&&!(cur in snap)){snap[cur]=null}
    if((m=/^LABEL /.exec(l)))continue;
    if((m=/^GOTO M\[SP\]$/.exec(l))){if(M[SP]===undefined)break;pc=lab[M[SP]];continue}
    if((m=/^GOTO (\S+)$/.exec(l))){if(opts.clobber&&m[1]===opts.fname)(opts.clobber).forEach(v=>V[v]=NaN);pc=lab[m[1]];continue}
    if((m=/^IF (\S+) (\S+) (\S+) THEN (\S+) ELSE (\S+)$/.exec(l))){pc=lab[ops[m[2]](val(m[1]),val(m[3]))?m[4]:m[5]];continue}
    if((m=/^SP := SP ([−-]|\+) (\d+)$/.exec(l))){SP+=(m[1]==='+'?1:-1)*+m[2];continue}
    if((m=/^(M\[SP(?:\+\d+)?\]) := (\S+)$/.exec(l))){M[addr(m[1])]=(m[2] in lab)?m[2]:val(m[2]);continue}
    if((m=/^(\S+) := (M\[SP(?:\+\d+)?\])$/.exec(l))){V[m[1]]=M[addr(m[2])];continue}
    if((m=/^(\S+) := (\S+) ([-+*<>=]) (\S+)$/.exec(l))){V[m[1]]=ops[m[3]](val(m[2]),val(m[4]));continue}

}

<h2>Method A · the textbook call sequence (caller-save)</h2>
<h3>The frame</h3>
<p>The stack grows <b>down</b>; <code>SP</code> points at the last used word. A call to a function with <i>n</i> arguments builds a block of <b>4·(n+1) bytes</b>:</p>
<div class="box"><div class="frame"><div class="fc hi">M[SP]  return address</div><div class="fc">M[SP+4]  argument 1 (and, coming back, the <b>result</b>)</div><div class="fc">M[SP+8]  argument 2</div><div class="fc dots">… M[SP+4n]  argument n</div></div>
<p><i>framesize</i> of a function is the space for <b>its own</b> memory-resident locals. It does not include the parameters or the return address.</p></div>
<h3>The algorithm</h3>
<p class="tag">INPUT: caller code, callee body, callee parameters p₁…pₘ, the returned variable, the callee's label f.</p>
<div class="box eq"><b>Part I · the caller (every <code>CALL</code> line)</b>
<ol class="rules">
<li><b>Liveness.</b> Compute <code>out[line]</code> for every caller line (Chapter 8). Straight-line code needs one backward pass: <code>in = gen ∪ (out − kill)</code>, <code>out[last] = ∅</code>. For a <code>CALL</code>: gen = its arguments, kill = its result. With loops or jumps, iterate to a fixed point.</li>
<li><b>Save set.</b> <code>save = out[call] − {result}</code>. Order the variables consistently: s₀, s₁, …, s<sub>k</sub>.</li>
<li><b>Write the rows</b> of Fig 9.4 in order (table below), with the call's own <i>n</i>, arguments and result.</li>
<li><b>Give every call its own return label</b> (<code>retA</code>, <code>retB</code>; the lecture writes <code>dynamicReturnAddrA/B</code>).</li>
<li><b>Replace the <code>CALL</code> line</b> by the rows. Every other caller line stays.</li></ol></div>
<div class="box eq"><b>Part II · the callee (once per function)</b>
<ol class="rules" start="6">
<li><b>Prologue</b> (Fig 9.2): label, read each parameter from the frame, then lower <code>SP</code> by <i>framesize</i>.</li>
<li><b>Body:</b> unchanged from Chapter 6.</li>
<li><b>Epilogue</b> (Fig 9.3), replacing <code>return x</code>: raise <code>SP</code>, store the result in <code>M[SP+4]</code>, then <code>GOTO M[SP]</code>.</li>
<li><b>framesize.</b> No calls inside and no spills means 0. A callee that makes calls needs 4 bytes per variable it must save.</li></ol></div>
<p><b>The dynamic GOTO.</b> <code>GOTO M[SP]</code> jumps to an address <i>read from memory</i>: the return address the caller stored. That is what lets one function return to different call sites.</p>
<h3>Fig 9.4 · the call sequence (exact)</h3>
<div class="scroll"><table class="ft c9"><tr class="hd"><th>Phase</th><th>Textbook</th></tr>
${FIG94.map(([p,g,c])=>`<tr class="${ph(p)}"><td class="pat">${PHN[p]}</td><td class="gl">${g}${c?`<div class="cm">${c}</div>`:''}</td></tr>`).join('')}</table></div>
<p>The saves use <code>M[SP]</code> <b>before</b> <code>SP</code> is lowered, so they land in the caller's own frame; the restores use <code>M[SP]</code> <b>after</b> <code>SP</code> is raised, so they read the same cells.</p>
<h3>Fig 9.2 and Fig 9.3 · prologue and epilogue (exact)</h3>
<div class="scroll"><table class="ft c9"><tr class="hd"><th></th><th>Textbook</th></tr>
<tr class="ph-go"><td class="pat">Fig 9.2 prologue</td><td class="gl">LABEL f<br>p₁ := M[SP+4]<br>…<br>p_m := M[SP+4*m]<br>SP := SP − framesize<sub>f</sub></td></tr>
<tr class="ph-res"><td class="pat">Fig 9.3 epilogue</td><td class="gl">SP := SP + framesize<sub>f</sub><br>M[SP+4] := <i>result</i><br>GOTO M[SP]</td></tr></table></div>
<div class="box ok"><b>Checks.</b> <code>SP</code> goes down and up by the same amount around each call · every saved variable has a restore in the same slot · every call has a different return label · the epilogue raises <code>SP</code> <i>before</i> the jump.</div>`}

function algB(){return `
<h2>Method B · inlining</h2>
<p class="tag">INPUT: caller code, callee body, callee parameters p₁…pₘ, the returned variable x.</p>
<div class="box eq"><b>For each <code>res := CALL f(a₁, …, aₙ)</code>, in order (copy c = 1, 2, …):</b>
<ol class="rules">
<li><b>Choose this copy's renaming.</b> The first copy can keep the body's own names. Every later copy needs <b>fresh</b> names for every <b>jump label</b> (essential), and for the <b>parameters</b>, any <b>local variables</b> and the <b>temporaries</b> (what the textbook asks for, to prevent capture). Keep the numbering order when renaming (t8→t17, t9→t18, …) so the copy is easy to check.</li>
<li><b>Initialise the parameters:</b> <code>p₁′ := a₁</code>, …, <code>pₘ′ := aₘ</code>.</li>
<li><b>Paste the body</b>, applying the renaming to every line.</li>
<li><b>Turn the return into an assignment:</b> <code>res := x′</code>. (Here <code>return</code> is the last statement, so no jump to an end label is needed.)</li>
<li><b>Delete the <code>CALL</code> line.</b></li></ol></div>
<div class="box ok"><b>Checks.</b> No <code>CALL</code> is left · no label is defined twice · the parameters are assigned before the body runs · the copy ends with the assignment to <code>res</code> · the body's temporaries do not collide with the caller's.</div>
<h3>What inlining does not need</h3>
<p>No stack, no <code>SP</code> arithmetic, no liveness, no return address, no save or restore. The price is size: one copy of the body per call.</p>
<h3>Why the renaming is not optional for labels</h3>
<p>If both copies contain <code>LABEL L0</code>, a <code>GOTO L0</code> has two possible targets. Variables are more forgiving: copies run one after the other and each initialises its own parameters, so reusing them can still work (stage 5 shows it running). The textbook procedure renames them anyway, and so should you.</p>`}

/* ---------- walk engine ---------- */
function walkSecs(E,m){
  return m==='A'?secsA(E):secsB(E)}
function totalSteps(secs){return secs.reduce((a,s)=>a+s.n,0)}
function renderWalk(E,m,step){
  const secs=walkSecs(E,m);let off=0,h='';
  secs.forEach(s=>{const k=Math.max(0,Math.min(s.n,step-off));
    if(k>0){const cur=step>off&&step<=off+s.n;h+=`<section class="wsec${cur?' now':''}" ${cur?'id="now"':''}><h3>${s.t}</h3>${s.r(k)}</section>`}
    off+=s.n});
  return h}
const codeBox=(E)=>`<div class="row"><div class="col"><div class="tag">CALLER (Chapter 6 code) · ${esc(E.srcMain)}</div>${listing(E.main.map((l,i)=>({html:`<span class="no">${String(i+1).padStart(2)} </span>${esc(l)}`,txt:l,c:/CALL/.test(l)})),o=>o.c?'ph-arg':'')}</div>
<div class="col"><div class="tag">CALLEE BODY (Chapter 6 code) · ${esc(E.srcFun)}</div>${listing(E.body)}</div></div>
<div class="box">Symbol table: <code>${esc(E.sym)}</code>. Parameters: <b>${E.params.join(', ')}</b> (${E.pnames.join(', ')}). The function returns <b>${E.ret}</b> (${E.retName}). ${E.note}</div>`;

function secsA(E){
  const P=E.planD,live=P.live,L=live.length,calls=P.seqs,C=calls.length;
  const S=[];
  S.push({t:'Step 1 · What you start from',n:1,r:()=>codeBox(E)+`<p>The two <code>CALL</code> lines are shaded. Everything else in the caller stays untouched.</p>`});
  S.push({t:'Step 2 · Liveness of the caller (backward, one line per step)',n:L,r:k=>{
    let h=`<p>Start at the last line with <code>out = ∅</code>. Then <code>in = gen ∪ (out − kill)</code>, and <code>out</code> of a line is <code>in</code> of the next one.</p><div class="scroll"><table class="t"><tr><th>#</th><th>line</th><th>gen</th><th>kill</th><th>in</th><th>out</th></tr>`;
    for(let i=L-k;i<L;i++){const r=live[i],isCall=r.p.k==='call';h+=`<tr class="${i===L-k?'cur':''}"><td class="i">${i+1}</td><td>${esc(r.line)}</td><td>${setCh(r.gen)}</td><td>${setCh(r.kill)}</td><td>${setCh(r.in)}</td><td>${setCh(r.out)}</td></tr>`}
    h+='</table></div>';const r=live[L-k];
    h+=`<div class="box eq">Line ${L-k+1}: <code>out</code> = ${L-k===L-1?'∅ (last line)':'<code>in</code> of line '+(L-k+2)+' = '+setCh(r.out)}. <code>in</code> = gen ∪ (out − kill) = ${setCh(r.gen)} ∪ (${setCh(r.out)} − ${setCh(r.kill)}) = <b>${setCh(r.in)}</b>.${r.p.k==='call'?' <i>This is a call: its gen is its arguments and its kill is its result.</i>':''}</div>`;return h}});
  S.push({t:'Step 3 · The save set of each call',n:C,r:k=>{let h='';
    for(let j=0;j<k;j++){const c=calls[j];h+=`<div class="box ${c.save.length?'warn':'ok'}"><b>Call ${j+1}</b> <code>${esc(c.row.line)}</code> (line ${c.i+1}): <code>out</code> = ${setCh(c.row.out)}; minus the call's result <b>${c.row.p.res}</b> → <b>save ${setCh(c.save)}</b>. ${c.save.length?c.save.map((v,i)=>`<code>${v}</code> goes in slot <code>${i?'M[SP+'+4*i+']':'M[SP]'}</code>`).join(', ')+'.':'Nothing: no save and no restore lines.'}<br><span class="tag">${E.id==='e1'?(j===0?'t3 and t4 are only read by the call, so they are dead after it. t1 is needed by the second call.':'Everything the call needs travels through the stack; only the result t0 is used afterwards.'):(j===0?'n is needed again as an argument of the second call.':'p is read on line 8, AFTER this call, so it must be saved. n is not saved: its last use (line 6) is before the call.')}</span></div>`}return h}});
  S.push({t:'Step 4 · Fill in Fig 9.4 for each call, row by row',n:C*8,r:k=>{let h='';
    for(let j=0;j<C;j++){const rows=Math.max(0,Math.min(8,k-j*8));if(!rows)continue;const c=calls[j],n=c.row.p.args.length;
      h+=`<p><b>Call ${j+1}:</b> <code>${esc(c.row.line)}</code> · n = ${n} · return label <code>ret${'AB'[j]}</code></p><div class="scroll"><table class="ft c9"><tr class="hd"><th>Phase</th><th>Fig 9.4 (exact)</th><th>Your lines</th></tr>`;
      FIG94.slice(0,rows).forEach(([p,g,cm],ri)=>{const last=ri===rows-1&&k-j*8<=8&&(j===Math.floor((k-1)/8));
        const ls=c.seq.filter(x=>x.ph===p).map(x=>x.note?`<i>none: nothing is live across this call</i>`:esc(x.txt));
        h+=`<tr class="${ph(p)}${last?' cur':''}"><td class="pat">${PHN[p]}</td><td class="gl">${g}</td><td class="cv">${ls.join('<br>')||'<span class="dots">none</span>'}</td></tr>`});
      h+='</table></div>';
      if(j===Math.floor((k-1)/8)){const p=FIG94[rows-1][0];const T={save:c.save.length?`save set ${setCh(c.save)} → one line per variable, slots M[SP], M[SP+4], … in that order`:'the save set is empty, so this row writes nothing',
        reserve:`4·(n+1) = 4·(${n}+1) = <b>${4*(n+1)}</b> bytes: space for the return address and ${n} argument${n>1?'s':''}`,
        args:`argument i goes to M[SP+4·i]: ${c.row.p.args.map((a,i)=>`<code>${a}</code> → <code>M[SP+${4*(i+1)}]</code>`).join(', ')}`,
        ret:`a label of its own for this call: <code>ret${'AB'[j]}</code>. The callee will jump back to whatever address is stored here`,
        goto:`jump to the function, and put the return label right after the jump so execution resumes here`,
        fetch:`the callee left its result in <code>M[SP+4]</code>; copy it into the call's result variable <code>${c.row.p.res}</code>`,
        free:`undo the reserve: <code>SP</code> up by ${4*(n+1)}, the same amount it went down`,
        restore:c.save.length?`read the saved variables back from the same slots, in the same order, into the same variables`:'nothing was saved, so nothing is restored'}[p];
        h+=`<div class="box eq"><b>${PHN[p]}.</b> ${T}.</div>`}}
    return h}});
  S.push({t:'Step 5 · The callee: prologue (Fig 9.2) and epilogue (Fig 9.3)',n:3,r:k=>{
    const pro=P.pro.map(o=>esc(o.txt)).join('<br>'),epi=P.epi.map(o=>esc(o.txt)).join('<br>');
    let h=`<div class="scroll"><table class="ft c9"><tr class="hd"><th></th><th>Textbook (exact)</th><th>For ${E.fname}(${E.pnames.join(', ')})</th></tr>`;
    if(k>=1)h+=`<tr class="ph-go${k===1?' cur':''}"><td class="pat">Fig 9.2 prologue</td><td class="gl">LABEL f<br>p₁ := M[SP+4]<br>…<br>p_m := M[SP+4*m]<br>SP := SP − framesize<sub>f</sub></td><td class="cv">${pro}</td></tr>`;
    if(k>=2)h+=`<tr${k===2?' class="cur"':''}><td class="pat">body</td><td class="gl"><i>translated statements</i></td><td class="cv">the Chapter 6 body from Step 1, unchanged</td></tr>`;
    if(k>=3)h+=`<tr class="ph-res cur"><td class="pat">Fig 9.3 epilogue</td><td class="gl">SP := SP + framesize<sub>f</sub><br>M[SP+4] := <i>result</i><br>GOTO M[SP]</td><td class="cv">${epi}</td></tr>`;
    h+='</table></div>';
    h+=k===1?`<div class="box eq">The parameters are read from the frame the caller built: parameter i at <code>M[SP+4i]</code>. <code>SP</code> is lowered only <i>after</i> reading them.</div>`:
        k===2?`<div class="box eq">Nothing changes inside the body.</div>`:
        `<div class="box eq"><b>${E.retName === 'x'?'return x':'return '+E.retName}</b> becomes the epilogue with <i>result</i> = <code>${E.ret}</code>. <code>SP</code> is raised first so it points at the cell holding the return address; the result goes into <code>M[SP+4]</code> (overwriting argument 1's slot, which is already copied); then <code>GOTO M[SP]</code> is the <b>dynamic GOTO</b>.</div><div class="box warn"><b>framesize = 0</b> here: ${E.fname} makes no calls and needs no spilled variables. Write <code>framesize</code> and state that it is 0.</div>`;
    return h}});
  S.push({t:'Step 6 · The final answer',n:1,r:()=>`<div class="row"><div class="col"><div class="tag">MAIN (final version, no CALL left)</div>${listing(P.out.filter(o=>!o.txt.startsWith('//')),o=>ph(o.ph))}</div><div class="col"><div class="tag">FUNCTION ${esc(E.fname)} (completed)</div>${listing([...P.pro.map(o=>({txt:o.txt,ph:'pro'})),...E.body.map(l=>({txt:l,ph:'body'})),...P.epi.map(o=>({txt:o.txt,ph:'epi'}))],o=>ph(o.ph))}</div></div><div class="legend"><span><span class="swatch ph-save"></span>save / restore</span><span><span class="swatch ph-res"></span>reserve / free / epilogue</span><span><span class="swatch ph-arg"></span>arguments</span><span><span class="swatch ph-ret"></span>return address</span><span><span class="swatch ph-go"></span>jump / label / prologue</span><span><span class="swatch ph-fet"></span>result</span></div>`});
  const pl=E.pre.length,main=P.out.filter(o=>!o.txt.startsWith('//')),prog=[...E.pre.map(t=>({txt:t,part:'pre'})),...main.map(o=>({txt:o.txt,part:'MAIN',ph:o.ph})),{txt:'GOTO END',part:'x'},...P.pro.map(o=>({txt:o.txt,part:'f',ph:'pro'})),...E.body.map(l=>({txt:l,part:'f',ph:'body'})),...P.epi.map(o=>({txt:o.txt,part:'f',ph:'epi'})),{txt:'LABEL END',part:'x'}];
  S.push({t:'Step 7 · Run it and watch the stack',n:prog.length,r:k=>{
    const idx=k-1,sn=E.run.snap[idx];
    const h=`<p>A tiny machine executes the final code (MAIN, then the function). Loop lines show the state the <i>first</i> time they run. At each jump to the function the caller's variables are flushed, as a real callee may overwrite them. Offsets are relative to <code>SP₀</code>, the value of <code>SP</code> in MAIN.</p>
    <div class="row"><div class="col" style="flex:2 1 380px"><pre class="code run">${prog.map((l,i)=>`<span class="ln ${i===idx?'cur':''} ${l.part==='MAIN'?ph(l.ph):''}">${String(i+1).padStart(2)}  ${esc(l.txt)}</span>`).join('')}</pre></div>
    <div class="col" style="flex:1 1 240px"><div class="box"><b>${esc(prog[idx].txt)}</b></div>${memRows(sn,1000)}<div class="vars"><div class="stkh">Variables now</div>${sn?Object.entries(sn.V).filter(([a,v])=>!Number.isNaN(v)).map(([a,v])=>`<span class="chip">${a} = ${esc(v)}</span>`).join(' '):''}</div></div></div>`;
    return h+(k===prog.length?`<div class="box ok">Result: <b>${resultOf(E,E.run)}</b>, and SP is back at SP₀ (${E.run.SP===1000?'✓':E.run.SP}).</div>`:'')}});
  return S}

function secsB(E){
  const I=E.inl,copies=I.copies,C=copies.length;
  const S=[];
  const renameRows=(c)=>{const m=copies[c].map;const kinds={labels:[],params:[],locals:[],temps:[]};
    Object.keys(m).forEach(o=>{if(/^L/.test(o))kinds.labels.push(o);else if(E.params.includes(o))kinds.params.push(o);else if(/^u/.test(o))kinds.locals.push(o);else kinds.temps.push(o)});
    const num=a=>a.sort((x,y)=>(+x.slice(1))-(+y.slice(1)));Object.values(kinds).forEach(num);
    const row=(nm,a)=>a.length?`<tr><td>${nm}</td><td>${a.join(', ')}</td><td>${a.map(o=>m[o]).join(', ')}</td></tr>`:'';
    return row('labels',kinds.labels)+row('parameters',kinds.params)+row('local variables',kinds.locals)+row('temporaries',kinds.temps)};
  S.push({t:'Step 1 · What you start from',n:1,r:()=>codeBox(E)});
  S.push({t:'Step 2 · Decide the renaming for each copy',n:C,r:k=>{let h='';
    for(let c=0;c<k;c++){h+=`<p><b>Copy ${c+1}</b> replaces <code>${esc(copies[c].call)}</code>. ${c===0?'The first copy keeps the body\'s own names.':'Every name that could clash with copy 1 gets a fresh one, taking the next free numbers and keeping the order.'}</p>`;
      if(c>0)h+=`<div class="scroll"><table class="t"><tr><th>kind</th><th>in copy 1</th><th>in copy ${c+1}</th></tr>${renameRows(c)}</table></div>`}
    return h+(k>1?`<div class="box warn"><b>Why the labels matter most.</b> Both copies would otherwise define the same labels, so a <code>GOTO</code> would have two possible targets. ${E.id==='e1'?'MAIN\'s temporaries (t0–t4) never clash with the function\'s (t5–t12) because the counters carried on from 2a into 2b.':'Here the function also has a <b>local variable</b> (u3), renamed like the parameters. Each copy re-initialises it, so nothing leaks between calls.'}</div>`:'')}});
  S.push({t:'Step 3 · Paste each copy: parameters, body, return',n:C*3,r:k=>{let h='';
    for(let c=0;c<C;c++){const st=Math.max(0,Math.min(3,k-c*3));if(!st)continue;const cp=copies[c],call=parseIR(cp.call),m=cp.map,rn=x=>m[x]||x;
      h+=`<p><b>Copy ${c+1}</b> replacing <code>${esc(cp.call)}</code></p>`;
      const cur=c===Math.floor((k-1)/3);
      let rows='';
      if(st>=1)rows+=E.params.map((q,i)=>`<span class="ln ph-arg${cur&&st===1?' cur':''}">${esc(rn(q))} := ${esc(call.args[i])}</span>`).join('');
      if(st>=2)rows+=E.body.map(l=>`<span class="ln ph-save${cur&&st===2?' cur':''}">${diffLine(l,l.replace(/\b[tuvL]\d+\b/g,x=>m[x]||x))}</span>`).join('');
      if(st>=3)rows+=`<span class="ln ph-fet${cur&&st===3?' cur':''}">${esc(call.res)} := ${esc(rn(E.ret))}</span>`;
      h+=`<pre class="code">${rows}</pre>`;
      if(cur)h+=`<div class="box eq">${st===1?`<b>Initialise the parameters</b> from the arguments: <code>${E.params.map((q,i)=>rn(q)+' := '+call.args[i]).join('</code>, <code>')}</code>.`:st===2?`<b>Paste the body</b>${c>0?', with the renamed names <mark>highlighted</mark>':', unchanged for the first copy'}.`:`<b>The return becomes an assignment</b> to the call's result: <code>${call.res} := ${rn(E.ret)}</code>. The <code>CALL</code> line is gone.`}</div>`}
    return h}});
  S.push({t:'Step 4 · The final MAIN (no CALL left)',n:1,r:()=>`${listing(I.out.map(o=>({txt:o.txt,c:o})),o=>o.c.note?'ph-go':o.c.ph==='plain'?'':o.c.copy===1?'ph-save':'ph-arg')}<div class="legend"><span><span class="swatch ph-save"></span>copy 1</span><span><span class="swatch ph-arg"></span>copy 2</span></div><p class="tag">The lines starting // are markers for you; leave them out of your answer or keep them as comments.</p>`});
  S.push({t:'Step 5 · Check by running it',n:1,r:()=>{const r=runMachine([...E.pre,...I.final],{});return `<div class="box ${okOf(E,r)?'ok':'warn'}">Executing the inlined MAIN gives <b>${resultOf(E,r)}</b>${E.note?'. '+E.note:''} No <code>CALL</code> is left.</div><p>A cheap check in the exam: trace one call by hand with small numbers, for example ${E.id==='e1'?'<code>add(4, 5)</code>, which should give 9':'<code>mul(4, 3)</code>, which should give 12'}.</p>`}});
  return S}

function exampleView(id){
  const E=ex(id),st=S.ex[id],secs=walkSecs(E,st.m),max=totalSteps(secs);st.step=Math.max(0,Math.min(st.step,max));
  let h=`<h2>${E.title}</h2><p class="lede">${id==='e1'?'The question from your test: <code>result := add(3, add(4,5))</code> and add\'s while-loop.':'A different shape: two calls with <b>different save sets</b>, a call used as an operand, and a callee with a <b>local variable</b>.'}</p>
  <div class="seg"><button class="${st.m==='A'?'on':''}" onclick="setM('${id}','A')">Method A · call sequence</button><button class="${st.m==='B'?'on':''}" onclick="setM('${id}','B')">Method B · inlining</button></div>
  <div class="ctl"><button onclick="wstep('${id}',-1)" ${st.step<=0?'disabled':''}>◀ Back</button><button onclick="wstep('${id}',1)" ${st.step>=max?'disabled':''}>Next ▶</button><input type="range" min="0" max="${max}" value="${st.step}" oninput="wstep('${id}',this.value,true)" style="flex:1;min-width:120px"><span class="cnt">${st.step} / ${max}</span><button class="quiet" onclick="wstep('${id}',0,true)">Reset</button><button class="quiet" onclick="wstep('${id}',${max},true)">Show all</button></div>`;
  if(st.step===0)h+=`<div class="box eq">Press <b>Next ▶</b> (or the right arrow key). Each press reveals one more step, and the newest part is highlighted.</div>`;
  return h+renderWalk(E,st.m,st.step)}
window.setM=(id,m)=>{S.ex[id].m=m;S.ex[id].step=0;draw()};
window.wstep=(id,d,abs)=>{
  const st=S.ex[id],E=ex(id),max=totalSteps(walkSecs(E,st.m));
  const next=abs?+d:st.step+(+d);
  st.step=Math.max(0,Math.min(max,next));
  draw(true);
};

/* ---------- edge cases ---------- */
const EDGES_B=[
 ['E1','Second copy keeps the first copy\'s labels','Both copies define the same labels, so a <code>GOTO L0</code> has two possible targets and jumps land in the wrong copy. Rename the labels in every copy after the first.','dup'],
 ['E2','The callee\'s temporaries restart from t0','The pasted body reuses names MAIN still needs. In Example 1 it overwrites <code>t1</code> (the 3) before call 2 reads it. In Example 2 it happens to survive, only because none of MAIN\'s temporaries is still needed at that point: do not rely on that. Keep the counters running from MAIN into the function, or rename the temporaries in the copy.','restart'],
 ['E3','An argument that is itself one of the callee\'s parameters','Typical when you inline at source level (<code>f(y, x)</code> into a function with parameters x, y). Assigning the parameters one after another overwrites an argument before it is read. Chapter 6 output avoids it because arguments are always fresh temporaries, but if you ever see a variable as an argument, copy through a temporary first or rename the callee\'s parameters.','swap'],
 ['E4','Only the labels are renamed','This still works here, because the copies run one after the other and each initialises its own parameters and locals. It is not what the textbook prescribes, so rename everything anyway.','labelsonly'],
 ['E5','A local variable in the callee','Rename it in every extra copy like the parameters (Example 2: u3 → u6). Do not rely on its old value; the body initialises it.',null],
 ['E6','A <code>return</code> in the middle','Not possible in this language, where return is the last statement, so <code>res := x′</code> is enough. With an early return you would need a jump to a label at the end of the copy.',null],
 ['E7','Recursion','A recursive function cannot be inlined completely, because each copy contains another call. Inline only calls to other functions, or stop at a fixed depth.',null],
 ['E8','The callee itself contains a call','Inlining leaves that inner <code>CALL</code> in the pasted copy. Inline it again, or expand it with Method A.',null],
 ['E9','A function called only once','No second copy, so no renaming is needed.',null]];
const EDGES_A=[
 ['E10','Empty save set','Example 1, call 2. Leave the save and restore rows empty. Reserve, arguments, return address, jump, fetch and free are still needed.',null],
 ['E11','Several saved variables','Slots are <code>M[SP]</code>, <code>M[SP+4]</code>, … in a fixed order, and the restores use the same slots in the same order.',null],
 ['E12','Forgetting the save','The callee may overwrite the caller\'s variable. Here the caller\'s variables are flushed at the jump to the function.','nosave'],
 ['E13','Reusing one return label for both calls','The callee returns to the first call forever.','samelabel'],
 ['E14','The save set depends on evaluation order','Example 2: a variable read <b>after</b> the call must be saved (<code>p</code> for call 2); one whose last read is before the call must not (<code>n</code> for call 2). Check where each variable is used relative to the call in the <i>translated</i> code.',null],
 ['E15','<code>SP</code> not back at the frame base before <code>GOTO M[SP]</code>','The jump would read the wrong cell. The epilogue must raise <code>SP</code> first, then write <code>M[SP+4]</code>, then <code>GOTO M[SP]</code>.',null],
 ['E16','The result overwrites argument 1\'s slot','Not a bug: the callee has copied its parameters in the prologue. Never read a parameter from the stack after the epilogue has started.',null],
 ['E17','<code>SP</code> unbalanced','Each <code>SP := SP − 4(n+1)</code> needs a matching <code>SP := SP + 4(n+1)</code> in the same call. A quick check that catches many slips.',null],
 ['E18','Saving too much','Saving a dead variable, or the call\'s own result, is usually still correct but is not what the question asks (the live variables only). Expect to lose marks.',null],
 ['E19','A call inside a loop','One backward pass is not enough: iterate liveness to a fixed point. A variable live around the back edge must be saved and restored on every iteration.',null],
 ['E20','A callee that makes calls itself','It must save its own live variables, so its framesize is at least 4 per saved slot. Here neither callee makes calls, so framesize is 0; state why.',null]];
const EDGE_RES={};
function edgeCard(e){const [id,t,body,kind]=e;
  let h=`<div class="edge"><div class="eh"><span class="badge">${id}</span> <b>${t}</b></div><p>${body}</p>`;
  if(kind){h+=`<div class="ctl"><button onclick="runEdge('${id}','${kind}')">Run it live</button></div><div id="er-${id}">${EDGE_RES[id]||''}</div>`}
  return h+'</div>'}
window.runEdge=(id,kind)=>{const out=['e1','e2'].map(x=>{const E=ex(x),v=variant(E,kind);return `<tr><td>${E.title.split('·')[0].trim()}</td><td>${v.desc}</td><td class="${v.ok?'good':'bad'}">${v.ok?'works':'FAILS'}: ${v.result}</td></tr>`}).join('');
  const sw=kind==='swap'?`<tr><td colspan="3" class="bad">${variant(ex('e1'),'swap').desc}<br>${variant(ex('e1'),'swap').result}</td></tr>`:out;
  EDGE_RES[id]=`<div class="scroll"><table class="t"><tr><th>example</th><th>variant</th><th>machine result (correct: ${Object.entries(ex('e1').expect).map(([k,v])=>k+' = '+v).join('; ')} / ${Object.entries(ex('e2').expect).map(([k,v])=>k+' = '+v).join(', ')})</th></tr>${sw}</table></div>`;
  $('#er-'+id).innerHTML=EDGE_RES[id]};
function edgeView(){return `<h2>Edge cases</h2><p class="lede">Each card says what goes wrong and what to do. The ones with a button run the broken version on the machine, on both examples, so you can see it fail. Correct answers: Example 1 gives <code>u0 = 12</code>; Example 2 gives <code>v1 = 12, v2 = 60</code>.</p>
<h3>Method B · inlining</h3>${EDGES_B.map(edgeCard).join('')}<h3>Method A · call sequence</h3>${EDGES_A.map(edgeCard).join('')}
<div class="box warn"><b>Not confirmed from your material:</b> the lecturer's inlining recipe; the book's R0…Rk saves versus the lecture's live-only saves; whether MAIN needs a frame (the saved values live there, so it needs 4 bytes per saved variable: one sentence covers it).</div>`}

function compareView(){return `<h2>Compare and checklist</h2>
<div class="scroll"><table class="ref"><tr><th></th><th>Method A · call sequence (2c.II)</th><th>Method B · inlining (2c.I)</th></tr>
<tr><td>New theory</td><td>stack, frame layout, liveness, prologue/epilogue</td><td>none</td></tr>
<tr><td>What you write</td><td>rows per call + prologue + epilogue</td><td>a renamed copy of the body per call</td></tr>
<tr><td>Main risk</td><td>wrong save set, wrong offsets</td><td>copying and renaming errors</td></tr>
<tr><td>Output size here</td><td>short</td><td>long (a copy of the loop per call)</td></tr></table></div>
<div class="box eq"><b>My recommendation:</b> use <b>inlining</b> unless you can write Fig 9.4 from memory and find the save set reliably. It needs less memorised theory and its checks are simple. Choose the call sequence if you are confident, because it is shorter to write for this question and covers more of the chapter. You only answer one of them.</div>
<div class="row"><div class="col"><h3>Method A checklist</h3><ol class="rules"><li>Liveness table for MAIN.</li><li>Save set per call = out − result.</li><li>Rows in order: save, reserve, arguments, return address, jump, fetch, free, restore.</li><li>Frame size 4(n+1) the same in reserve and free.</li><li>A different return label for each call.</li><li>Prologue loads every parameter from M[SP+4i], then SP := SP − framesize.</li><li>Epilogue: SP := SP + framesize, M[SP+4] := result, GOTO M[SP].</li></ol></div>
<div class="col"><h3>Method B checklist</h3><ol class="rules"><li>Copy 1: parameters from the arguments, body, res := x.</li><li>Later copies: fresh labels, parameters, locals and temporaries.</li><li>No label appears twice; no CALL left.</li><li>The body's temporaries do not collide with the caller's.</li><li>Trace one call by hand with small numbers to catch copying slips.</li></ol></div></div>`}

/* ---------- shell ---------- */
function draw(preserveScroll=false){
  const scrollY=window.scrollY;
  $('nav').innerHTML=STAGES.map((s,i)=>`<a class="${i===S.stage?'on':''}" onclick="go(${i})"><b>${i}</b>${s.t}</a>`).join('');
  $('main').innerHTML=[overview,algA,algB,()=>exampleView('e1'),()=>exampleView('e2'),edgeView,compareView][S.stage]();
  if(preserveScroll)window.scrollTo(0,scrollY)}
window.go=i=>{S.stage=i;draw();window.scrollTo(0,0)};
document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName)&&e.target.type!=='range')return;
  if(e.key!=='ArrowRight'&&e.key!=='ArrowLeft')return;const id=S.stage===3?'e1':S.stage===4?'e2':null;if(id)wstep(id,e.key==='ArrowRight'?1:-1)});
window.toggleTheme=()=>{const r=document.documentElement;const dark=r.dataset.theme==='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);r.dataset.theme=dark?'light':'dark'};
draw();
