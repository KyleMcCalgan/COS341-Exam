<p class="mut">Built from your Tutorial 5 exercise, Semester Test 2 Task 1, Homework 4 and the textbook's Chapter 5. The annotator in tab B and the inference in tab C are real implementations of the rules shown.</p>
<nav id="nav"></nav><section class="stage" id="s0"></section><section class="stage" id="sA"></section><section class="stage" id="sB"></section><section class="stage" id="sC"></section><section class="stage" id="sD"></section><section class="stage" id="sE"></section></div>
<script>// ===== Part B engine: Sem-Test-2 Task 1 language =====
const RULES_B={
1:{lhs:'ALGO₀',rhs:'INSTR ; ALGO₁',txt:'if typeOf(INSTR) is c and typeOf(ALGO₁) is c\nthen let typeOf(ALGO₀) be c\nelse let typeOf(ALGO₀) be e'},
2:{lhs:'ALGO',rhs:'ε',txt:'let typeOf(ALGO) be c'},
3:{lhs:'INSTR',rhs:'ASSIGN',txt:'let typeOf(INSTR) be typeOf(ASSIGN)      // c or e travels up'},
4:{lhs:'INSTR',rhs:'LOOP',txt:'let typeOf(INSTR) be typeOf(LOOP)'},
5:{lhs:'ASSIGN',rhs:'VAR := TERM',txt:'if typeOf(TERM) is e\nthen let typeOf(ASSIGN) be e\nelse if typeOf(VAR) is u\n     then let typeOf(VAR) be typeOf(TERM)   // first assignment fixes the variable (every VAR with this name)\n          let typeOf(ASSIGN) be c\n     else if typeOf(VAR) is typeOf(TERM)\n          then let typeOf(ASSIGN) be c\n          else let typeOf(ASSIGN) be e'},
6:{lhs:'LOOP',rhs:'while ( TERM ) do { ALGO }',txt:'if typeOf(TERM) is b and typeOf(ALGO) is c\nthen let typeOf(LOOP) be c\nelse let typeOf(LOOP) be e'},
7:{lhs:'VAR',rhs:'nameToken',txt:'if this name already received a type from an earlier assignment\nthen let typeOf(VAR) be that type\nelse leave typeOf(VAR) as u'},
8:{lhs:'TERM',rhs:'VAR',txt:'if typeOf(VAR) is n, b or s\nthen let typeOf(TERM) be typeOf(VAR)\nelse let typeOf(TERM) be e        // variable read before it was ever assigned'},
9:{lhs:'TERM',rhs:'numberToken',txt:'let typeOf(TERM) be n'},
10:{lhs:'TERM',rhs:'"textToken"',txt:'let typeOf(TERM) be s'},
11:{lhs:'TERM₀',rhs:'( TERM₁ OP TERM₂ )',txt:'if typeOf(TERM₁) is e or typeOf(TERM₂) is e then let typeOf(TERM₀) be e\nelse if OP is +  and both are n          then let typeOf(TERM₀) be n\nelse if OP is >  and both are n, or both are s   then let typeOf(TERM₀) be b\nelse if OP is ^  and both are b          then let typeOf(TERM₀) be b\nelse if OP is @  and both are s          then let typeOf(TERM₀) be s\nelse let typeOf(TERM₀) be e'},
12:{lhs:'OP',rhs:'+',txt:'let typeOf(OP) be n          // the result type this operator produces (rule 11 checks the operands)'},
13:{lhs:'OP',rhs:'>',txt:'let typeOf(OP) be b'},
14:{lhs:'OP',rhs:'^',txt:'let typeOf(OP) be b'},
15:{lhs:'OP',rhs:'@',txt:'let typeOf(OP) be s'}};
function tokB(src){const t=src.match(/"[^"]*"|:=|[A-Za-z_]\w*|\d+|[(){};+>^@]/g);if(!t)throw new Error('empty program');return t}
function parseB(src){const t=tokB(src);let p=0;const peek=()=>t[p],eat=x=>{if(t[p]!==x)throw new Error(`expected "${x}" but found "${t[p]??'end'}"`);p++};
  const N=(nt,rule,l,c)=>({nt,rule,l,c:c||[],hist:[]});
  function ALGO(){if(p>=t.length||peek()==='}')return N('ALGO',2,'ALGO ε');const i=INSTR();eat(';');const r=ALGO();return N('ALGO',1,'ALGO',[i,r])}
  function INSTR(){if(peek()==='while'){const l=LOOP();return N('INSTR',4,'INSTR',[l])}const a=ASSIGN();return N('INSTR',3,'INSTR',[a])}
  function VAR(){const n=t[p++];if(!/^[A-Za-z_]\w*$/.test(n)||n==='while'||n==='do')throw new Error('bad variable name '+n);const v=N('VAR',7,'VAR '+n);v.name=n;return v}
  function ASSIGN(){const v=VAR();eat(':=');const e=TERM();return N('ASSIGN',5,'ASSIGN',[v,e])}
  function LOOP(){eat('while');eat('(');const e=TERM();eat(')');eat('do');eat('{');const a=ALGO();eat('}');return N('LOOP',6,'LOOP',[e,a])}
  function TERM(){const x=peek();if(x===undefined)throw new Error('unexpected end');
    if(/^\d+$/.test(x)){p++;return N('TERM',9,'TERM '+x)}
    if(x[0]==='"'){p++;return N('TERM',10,'TERM '+x)}
    if(x==='('){p++;const a=TERM();const o=t[p++];const R={'+':12,'>':13,'^':14,'@':15}[o];if(!R)throw new Error('bad operator '+o);const op=N('OP',R,'OP '+o);op.op=o;const b=TERM();eat(')');return N('TERM',11,'TERM ( )',[a,op,b])}
    const v=VAR();return N('TERM',8,'TERM',[v])}
  const r=ALGO();if(p<t.length)throw new Error('unexpected "'+t[p]+'"');return r}
function annotateB(root){const env={};const steps=[];const vars=[];
  const setT=(n,ty,k)=>{n.hist.push({step:k,t:ty});n.t=ty};
  function go(n){n.c.forEach(go);const k=steps.length;let read='',res='',t='u',upd=null;
    const T=x=>x.t;
    switch(n.rule){
    case 1:{const [i,r]=n.c;read=`INSTR is ${T(i)}, ALGO₁ is ${T(r)}`;t=T(i)==='c'&&T(r)==='c'?'c':'e';break}
    case 2:t='c';read='ε: nothing to check';break;
    case 3:case 4:t=T(n.c[0]);read=`child is ${T(n.c[0])}`;break;
    case 5:{const [v,e]=n.c;read=`TERM is ${T(e)}, VAR is ${T(v)}`;
      if(T(e)==='e'){t='e'}
      else if(T(v)==='u'){t='c';env[v.name]=T(e);setT(v,T(e),k);upd=`VAR ${v.name} was u ⇒ now ${T(e)} (this is the variable's type from here on)`;
        // update every earlier VAR with this name that is still u is NOT needed (none can have been read as non-error)
      }
      else if(T(v)===T(e))t='c';else t='e';break}
    case 6:{const [e,a]=n.c;read=`TERM is ${T(e)}, ALGO is ${T(a)}`;t=T(e)==='b'&&T(a)==='c'?'c':'e';break}
    case 7:{if(env[n.name]){t=env[n.name];read=`name ${n.name} already has type ${t}`}else{t='u';read=`name ${n.name} has no type yet`}break}
    case 8:{const v=n.c[0];read=`VAR is ${T(v)}`;t=['n','b','s'].includes(T(v))?T(v):'e';break}
    case 9:t='n';read='number constant';break;
    case 10:t='s';read='text constant';break;
    case 11:{const [a,o,b]=n.c;read=`TERM₁ is ${T(a)}, OP is ${o.op}, TERM₂ is ${T(b)}`;
      const x=T(a),y=T(b);
      if(x==='e'||y==='e')t='e';
      else if(o.op==='+')t=x==='n'&&y==='n'?'n':'e';
      else if(o.op==='>')t=(x==='n'&&y==='n')||(x==='s'&&y==='s')?'b':'e';
      else if(o.op==='^')t=x==='b'&&y==='b'?'b':'e';
      else t=x==='s'&&y==='s'?'s':'e';break}
    case 12:t='n';read='operator +';break;case 13:t='b';read='operator >';break;case 14:t='b';read='operator ^';break;case 15:t='s';read='operator @';break}
    setT(n,t,k);n.step=k;steps.push({n,rule:n.rule,read,t,upd});}
  go(root);return steps}
const typeAt=(n,k)=>{let t='u';for(const h of n.hist)if(h.step<k)t=h.t;return t};
// ===== Part C engine: H4 inference =====
function H4tree(){let id=0;const N=(k,l,c,extra)=>Object.assign({id:id++,k,l,c:c||[],t:'u'},extra||{});
  const dig=(d)=>N('TERMd','TERM',[N('DIGIT','DIGIT',[N('leaf',d)])]);
  const vr=(nm)=>N('TERMv','TERM',[N('VAR','VAR '+nm)]);
  const add=(a,b)=>N('add','TERM add( , )',[a,b]),and=(a,b)=>N('and','TERM and( , )',[a,b]);
  const root=add(add(vr('₁'),add(dig('1'),dig('1'))),add(and(vr('₂'),dig('0')),vr('₃')));let q=0;(function w(n){n.id=q++;n.c.forEach(w)})(root);return root}
function inferH4(root,order){const log=[];let conflict=null;const nodes=[];(function w(n){nodes.push(n);n.c.forEach(w)})(root);
  const label=n=>n.l+(n.k=='leaf'?'':'')+` #${n.id}`;
  function set(n,ty,why,pass){if(conflict)return false;if(n.t==='u'){n.t=ty;log.push({pass,n,from:'u',to:ty,why});return true}
    if(n.t===ty)return false;conflict={n,had:n.t,wanted:ty,why};n.t='e';log.push({pass,n,from:conflict.had,to:'CONFLICT',why:why+` — but this node is already ${conflict.had}`});return true}
  function apply(n,pass){
    if(n.k==='add'){set(n,'n','add always yields a number',pass);n.c.forEach(c=>set(c,'n','add needs numeric operands (pushed down from the add node)',pass))}
    else if(n.k==='and'){set(n,'b','and always yields a boolean',pass);n.c.forEach(c=>set(c,'b','and needs boolean operands (pushed down from the and node)',pass))}
    else if(n.k==='TERMv'){const v=n.c[0];if(n.t!=='u')set(v,n.t,'TERM→VAR: the variable has the type of the TERM (inherited, down)',pass);if(v.t!=='u')set(n,v.t,'TERM→VAR: the TERM has the type of the variable (synthesised, up)',pass)}
    else if(n.k==='TERMd'){const d=n.c[0];if(n.t!=='u')set(d,n.t,'TERM→DIGIT: pass the TERM\'s type down to the DIGIT',pass);if(d.t!=='u')set(n,d.t,'TERM→DIGIT: copy the DIGIT\'s type up',pass)}
    else if(n.k==='DIGIT'){const l=n.c[0];if(n.t!=='u')set(l,n.t,`DIGIT→${l.l}: the digit is ${n.t==='b'?'boolean':'a number'} because its DIGIT node is`,pass)}
  }
  const pre=[],post=[];(function w(n){pre.push(n);n.c.forEach(w);post.push(n)})(root);
  const seq=order==='up'?post:pre;let pass=0;
  for(;;){pass++;const before=log.length;seq.forEach(n=>apply(n,pass));if(conflict||log.length===before||pass>20)break}
  return {log,conflict,nodes}}
var _x={parseB,annotateB,typeAt,H4tree,inferH4,RULES_B};

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const TN={n:'numeric',b:'boolean',s:'string',c:'correct',e:'wrong',u:'unknown'};
function legend(){return `<div class="legend"><span class="tn" style="background:#e3eefc">n numeric</span><span style="background:#efe5fa">b boolean</span><span style="background:#dff3ef">s string</span><span style="background:#e0f3e6">c correct</span><span style="background:#fbe3df">e wrong</span><span>u unknown</span></div>`}
// ---- generic tree drawing: node {l, c, hist|step,t} ----
function drawTree(root,k,tyAt,curStep){const W=112,H=78,BW=104,BH=42;let x=0,maxd=0;
  (function lay(n,d){n.d=d;maxd=Math.max(maxd,d);if(!n.c.length){n.x=x;x+=W;return}n.c.forEach(c=>lay(c,d+1));n.x=(n.c[0].x+n.c[n.c.length-1].x)/2})(root,0);
  let ln='',bx='';
  (function dr(n){const cx=n.x+BW/2+4,cy=n.d*H+4;n.c.forEach(c=>{ln+=`<line class="ln" x1="${cx}" y1="${cy+BH}" x2="${c.x+BW/2+4}" y2="${c.d*H+4}"/>`;dr(c)});
    const t=tyAt(n,k);const cur=curStep!==undefined&&n.stepNo===curStep-1;
    let l=n.l;if(l.length>17)l=l.slice(0,16)+'…';
    bx+=`<g class="${cur?'cur':''}"><rect class="t${t}" x="${n.x+4}" y="${cy}" width="${BW}" height="${BH}" rx="7"/><text class="lbl" x="${cx}" y="${cy+16}" text-anchor="middle">${esc(l)}</text><text class="tt" x="${cx}" y="${cy+33}" text-anchor="middle">${t==='u'?'T: unknown':'T: '+TN[t]}</text></g>`})(root);
  return `<div class="treebox"><svg width="${Math.max(x,W)+10}" height="${(maxd+1)*H+8}">${ln}${bx}</svg></div>`}
function stepper(host,total,render,start){let k=start===undefined?0:start;const box=document.createElement('div');host.appendChild(box);
  function r(){box.innerHTML=`<div class="row"><button class="btn" data-a="p">◀ Back</button><button class="btn pri" data-a="n">Next ▶</button><button class="btn" data-a="e">Jump to end</button><button class="btn" data-a="r">Reset</button><span class="mut">step ${k} / ${total}</span></div><div class="out"></div>`;
    box.querySelector('.out').innerHTML=render(k);
    box.querySelectorAll('button').forEach(b=>b.onclick=()=>{const a=b.dataset.a;if(a=='n')k=Math.min(total,k+1);if(a=='p')k=Math.max(0,k-1);if(a=='e')k=total;if(a=='r')k=0;r()})}
  r()}
// ================= PART A data =================
function mk(l,c,t,why,rule){return{l,c:c||[],t,why,rule}}
function treeA(){
 const L=(l,t,why,rule)=>mk(l,[],t,why,rule);
 const root=mk('PROGRAM',[
  mk('VAR-DECL',[L('int n','n','The declaration "int n" introduces n and records it in the table as numeric. From now on every occurrence of n (same scope) is numeric.','declaration: table[n] := numeric')],'c','The declaration itself has nothing to disagree with, so it is correct.','all parts correct ⇒ correct'),
  mk('ALGO',[mk('LOOP',[
    L('while','c','A keyword carries no value and has nothing to check: correct.','keyword'),
    mk('TERM',[L('n>1','b','n is numeric (table), 1 is numeric. ">" needs both sides the same kind and produces a truth value.','comparison: both numeric ⇒ boolean')],'b','TERM just passes its child\'s type up.','copy child'),
    mk('ALGO',[mk('BRANCH',[

function stage0(){$('s0').innerHTML=`<h2>One method that answers every Chapter 5 question</h2>
<div class="card"><b>What Chapter 5 really is.</b> A tree already exists (the parser built it). Type analysis walks that tree and gives <b>every node an attribute</b> (its type, or a verdict like correct/wrong). The whole chapter is: <i>which rule decides each node's attribute, and in what order do the rules run?</i> Four question styles, one engine:
<table><tr><th>Style</th><th>You are asked to…</th><th>Seen in</th><th>Tab</th></tr>
<tr><td>ANNOTATE</td><td class="wrap">Given a tree, fill in every node's attribute and say where it goes wrong.</td><td>Tutorial 5 "past exam question"</td><td>A</td></tr>
<tr><td>WRITE RULES</td><td class="wrap">Given a grammar, write an if/then/else attribution rule for each production.</td><td>Sem Test 2 Task 1, H4 Sub-task A</td><td>B, C</td></tr>
<tr><td>INFER</td><td class="wrap">Some types are unknown; work out who forces whom, up and down the tree, until it settles or conflicts.</td><td>H4 Sub-task B</td><td>C</td></tr>
<tr><td>TEXTBOOK CODE</td><td class="wrap">Write or trace <code>CheckExp(e, vtable, ftable)</code> and friends; classify attributes as inherited/synthesised.</td><td>Tutorial 5, textbook 5.2–5.6</td><td>D</td></tr></table></div>
<h3>The algorithm (works whatever the question looks like)</h3>
<div class="step"><b>Step 1 · Write down the attribute alphabet.</b> What values can a node carry and what does each mean? In the test: <code>u e c n b s</code>. Then split the node kinds into two groups: <b>value nodes</b> (expressions: they end as n / b / s, or e) and <b>verdict nodes</b> (statements, sequences, programs: they end as c or e). The test says it outright: <i>c may only be carried if there is no error anywhere underneath.</i></div>
<div class="step"><b>Step 2 · For each production ask three questions.</b>
 <ol><li><b>Read</b>: which children (↑), which table (↔), which parent expectation (↓) do I need?</li><li><b>Check</b>: what must be true for this node to be legal?</li><li><b>Write</b>: what attribute does this node get when the check passes? (and when it fails: always <code>e</code>)</li></ol></div>
<div class="step"><b>Step 3 · Write it in the template.</b> <pre>if  ⟨checks on what I read⟩
then let typeOf(node) be ⟨result⟩
else let typeOf(node) be e</pre> Errors propagate because every rule begins by treating an <code>e</code> child as failure.</div>
<div class="step"><b>Step 4 · Pick the order.</b> Leaves first. Anything that fills a table (declarations, first assignments) must run <b>before</b> the nodes that read it, so go left to right through statements. A statement sequence is just: do the first instruction, then the rest.</div>
<div class="step"><b>Step 5 · If some types start unknown (inference).</b> Do a <b>downward pass</b> (parents hand expected types to children), then an <b>upward pass</b> (children hand their types to parents). Repeat until nothing changes. A <b>conflict</b> is the moment some node would receive a second, different type.</div>
<div class="step"><b>Step 6 · Read the answer at the root.</b> Root = c ⇒ the whole program is type-correct. Root = e ⇒ follow the e's downward to the <i>lowest</i> e: that node is the real mistake; everything above it is just inheriting the error.</div>
<h3>Rule templates for every kind of node you will meet</h3>
<table><tr><th>Node kind</th><th>Read</th><th>Template</th></tr>
<tr><td>constant (number, text)</td><td>—</td><td class="wrap"><code>let typeOf(node) be n</code> / <code>s</code></td></tr>
<tr><td>variable use</td><td>↔ table</td><td class="wrap">if the name has a type then that type, else <code>e</code> (undeclared / no value yet)</td></tr>
<tr><td>declaration</td><td>—</td><td class="wrap">record name → type in the table; node is <code>c</code></td></tr>
<tr><td>operator on operands</td><td>↑ both children + which operator</td><td class="wrap">if both operands have the types this operator demands then its result type else <code>e</code></td></tr>
<tr><td>comparison</td><td>↑ both</td><td class="wrap">if both sides have the same type then <code>b</code> else <code>e</code></td></tr>
<tr><td>assignment</td><td>↑ variable, ↑ right side</td><td class="wrap">if right side isn't <code>e</code> and the types agree then <code>c</code> else <code>e</code> (with no declarations: the first assignment fixes the variable's type)</td></tr>
<tr><td>if / while</td><td>↑ condition, ↑ bodies</td><td class="wrap">if condition is <code>b</code> and every body is <code>c</code> then <code>c</code> else <code>e</code></td></tr>
<tr><td>sequence / block / program</td><td>↑ all parts</td><td class="wrap">if every part is <code>c</code> then <code>c</code> else <code>e</code>; empty ⇒ <code>c</code></td></tr>

<div class="mut">Everything in tabs A–C below was run by code: the annotator in tab B and the inference in tab C are real implementations of the rules shown, not hand-drawn.</div>`}

function stageD(){$('sD').innerHTML=`<h2>D · The textbook style, and every other Chapter 5 question I can see</h2>
<h3>1 · The textbook machinery (5.2–5.6)</h3>
<div class="card"><b>Two tables.</b> <code>vtable</code>: variable → type. <code>ftable</code>: function → (argument types) → result type. They are <b>inherited</b> attributes (passed down into every sub-call). The type returned by each call is <b>synthesised</b> (passed up). <code>CheckExp(exp, vtable, ftable)</code> returns the type, or reports an error and returns a <b>guessed</b> type so checking can continue (so only the first error message is reliable).</div>
<table><tr><th>Expression</th><th>Rule inside CheckExp</th></tr>
<tr><td class="mono">number</td><td class="wrap">returns int</td></tr>
<tr><td class="mono">variable x</td><td class="wrap">lookup(vtable, x); not found ⇒ error, guess int</td></tr>
<tr><td class="mono">e₁ + e₂</td><td class="wrap">t₁ = CheckExp(e₁), t₂ = CheckExp(e₂); both must be int; result int</td></tr>
<tr><td class="mono">e₁ &lt; e₂ (or =)</td><td class="wrap">t₁ must equal t₂; result bool</td></tr>
<tr><td class="mono">if c then e₁ else e₂</td><td class="wrap">c must be bool; e₁, e₂ same type; result that type (guess: the then-type)</td></tr>
<tr><td class="mono">f(args)</td><td class="wrap">lookup(ftable, f); number and types of arguments (CheckExps) must match; result = declared result type</td></tr>
<tr><td class="mono">let x = e₁ in e₂</td><td class="wrap">t₁ = CheckExp(e₁); check e₂ with vtable extended by x : t₁; result type of e₂; no check of its own</td></tr></table>

<div class="card"><b>Functions and programs.</b> <code>CheckFun</code>: build a <code>vtable</code> from the parameters (rejecting duplicate parameter names), check the body with it, and require <i>body type = declared result type</i>; it returns nothing, it only reports errors. <code>CheckProgram</code> needs <b>two passes</b>: functions can call each other, so pass 1 (<code>GetFuns</code>) builds <code>ftable</code> for <i>all</i> functions and rejects duplicate function names; pass 2 (<code>CheckFuns</code>) checks every body using the complete table. Finally <code>main</code> must exist and take one int and return int.</div>

<div class="card"><pre>ATTRIBUTE ALPHABET: u unknown · n b s value types · c correct (no error below) · e error
VALUE nodes (TERM, OP, VAR) end as n/b/s/e      VERDICT nodes (ALGO, INSTR, ASSIGN, LOOP, PROGRAM) end as c/e

RULE TEMPLATE   if ⟨checks on children / table⟩  then let typeOf(node) be ⟨result⟩  else let typeOf(node) be e

constant            → its type                     variable use  → table lookup, else e
operator (a op b)   → both children right type ⇒ result, else e
comparison          → same type both sides ⇒ b
assignment          → rhs ≠ e and types agree ⇒ c   (no declarations: 1st assignment fixes the type)
if / while          → cond b AND bodies c ⇒ c
sequence / program  → all parts c ⇒ c ; empty ⇒ c
call                → name in ftable, args match ⇒ return type
keyword leaf        → c

ORDER  leaves first · left to right (tables fill as you go) · root: c = correct, e = follow e's down to the LOWEST e
INFERENCE (H4)  ↓ pass: parent pushes expected type to unknown children   ↑ pass: child reports known type to unknown parent
                repeat until no change · CONFLICT = a node would get a 2nd, different type
                digits 0/1: receive a type, never decide one · and → boolean · add → numeric
TEXTBOOK  CheckExp(exp, vtable, ftable) returns type · vtable/ftable INHERITED (down) · type SYNTHESISED (up)
          error ⇒ report + return a guessed type · CheckProgram: pass 1 build ftable (dups?), pass 2 check bodies, main(int):int
          static vs dynamic = when checked · strong vs weak = whether bad operations are prevented</pre></div>`}
