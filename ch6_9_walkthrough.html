<header><h1>COS341 · Chapters 6 &amp; 9</h1><span class="sub">Semester Test 2, Task 2: tree method and textbook tables, side by side</span><span class="spacer"></span><a class="index-link" href="index.html">← Index</a><button class="quiet themebtn" onclick="toggleTheme()">Light / dark</button></header>

<script>
"use strict";
/* ============================================================
   Helpers
   ============================================================ */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtSet=a=>{a=[...a].sort((x,y)=>x.localeCompare(y,undefined,{numeric:true}));return a.length?'{'+a.map(esc).join(', ')+'}':'∅'};
const iv=(n,s)=>`<i>${n}${s?`<sub>${s}</sub>`:''}</i>`;
const T_EXP='<i>Trans<sub>Exp</sub></i>',T_EXPS='<i>Trans<sub>Exps</sub></i>',T_STAT='<i>Trans<sub>Stat</sub></i>',T_COND='<i>Trans<sub>Cond</sub></i>';
const VF=`${iv('vtable')}, ${iv('ftable')}`;

/* ============================================================
   The textbook's recursive tables, line for line
   (Fig 6.3 TransExp + TransExps, Fig 6.5 TransStat, Fig 6.6 and Fig 6.8 TransCond)
   ============================================================ */
const TB={
 Exp:{fig:'6.3',title:`${T_EXP}(${iv('Exp')}, ${VF}, ${iv('place')}) = case ${iv('Exp')} of`,rows:[
  {key:'e_num',pat:'<b>num</b>',lines:[
    `${iv('v')} = ${iv('getvalue')}(<b>num</b>)`,
    `[${iv('place')} := ${iv('v')}]`]},
  {key:'e_id',pat:'<b>id</b>',lines:[
    `${iv('x')} = ${iv('lookup')}(${iv('vtable')}, ${iv('getname')}(<b>id</b>))`,
    `[${iv('place')} := ${iv('x')}]`]},
  {key:'e_unop',pat:`<b>unop</b> ${iv('Exp',1)}`,lines:[
    `${iv('place',1)} = ${iv('newvar')}()`,
    `${iv('code',1)} = ${T_EXP}(${iv('Exp',1)}, ${VF}, ${iv('place',1)})`,
    `${iv('op')} = ${iv('transop')}(${iv('getopname')}(<b>unop</b>))`,
    `${iv('code',1)} ++ [${iv('place')} := ${iv('op')} ${iv('place',1)}]`]},
  {key:'e_binop',pat:`${iv('Exp',1)} <b>binop</b> ${iv('Exp',2)}`,lines:[
    `${iv('place',1)} = ${iv('newvar')}()`,
    `${iv('place',2)} = ${iv('newvar')}()`,
    `${iv('code',1)} = ${T_EXP}(${iv('Exp',1)}, ${VF}, ${iv('place',1)})`,
    `${iv('code',2)} = ${T_EXP}(${iv('Exp',2)}, ${VF}, ${iv('place',2)})`,
    `${iv('op')} = ${iv('transop')}(${iv('getopname')}(<b>binop</b>))`,
    `${iv('code',1)} ++ ${iv('code',2)} ++ [${iv('place')} := ${iv('place',1)} ${iv('op')} ${iv('place',2)}]`]},
  {key:'e_call',pat:`<b>id</b>(${iv('Exps')})`,lines:[
    `(${iv('code',1)}, [${iv('a',1)},...,${iv('a','n')}]) = ${T_EXPS}(${iv('Exps')}, ${VF})`,
    `${iv('fname')} = ${iv('lookup')}(${iv('ftable')}, ${iv('getname')}(<b>id</b>))`,
    `${iv('code',1)} ++ [${iv('place')} := CALL ${iv('fname')}(${iv('a',1)},...,${iv('a','n')})]`]},
  {key:'e_true',fig:'6.8',pat:'true',lines:[`[${iv('place')} := 1]`]},
  {key:'e_false',fig:'6.8',pat:'false',lines:[`[${iv('place')} := 0]`]},
  {key:'e_cond',fig:'6.8',pat:iv('Cond'),lines:[
    `${iv('label',1)} = ${iv('newlabel')}()`,
    `${iv('label',2)} = ${iv('newlabel')}()`,
    `${iv('code',1)} = ${T_COND}(${iv('Cond')}, ${iv('label',1)}, ${iv('label',2)}, ${VF})`,
    `[${iv('place')} := 0] ++ ${iv('code',1)}<br>&nbsp;&nbsp;&nbsp;++ [LABEL ${iv('label',1)}, ${iv('place')} := 1]<br>&nbsp;&nbsp;&nbsp;++ [LABEL ${iv('label',2)}]`]}
 ]},
 Exps:{fig:'6.3',title:`${T_EXPS}(${iv('Exps')}, ${VF}) = case ${iv('Exps')} of`,rows:[
  {key:'exps_one',pat:iv('Exp'),lines:[
    `${iv('place')} = ${iv('newvar')}()`,
    `${iv('code',1)} = ${T_EXP}(${iv('Exp')}, ${VF}, ${iv('place')})`,
    `(${iv('code',1)}, [${iv('place')}])`]},
  {key:'exps_more',pat:`${iv('Exp')} , ${iv('Exps')}`,lines:[
    `${iv('place')} = ${iv('newvar')}()`,
    `${iv('code',1)} = ${T_EXP}(${iv('Exp')}, ${VF}, ${iv('place')})`,
    `(${iv('code',2)}, ${iv('args')}) = ${T_EXPS}(${iv('Exps')}, ${VF})`,
    `${iv('code',3)} = ${iv('code',1)} ++ ${iv('code',2)}`,
    `${iv('args',1)} = ${iv('place')} :: ${iv('args')}`,
    `(${iv('code',3)}, ${iv('args',1)})`]}
 ]},
 Stat:{fig:'6.5',title:`${T_STAT}(${iv('Stat')}, ${VF}) = case ${iv('Stat')} of`,rows:[
  {key:'s_seq',pat:`${iv('Stat',1)} ; ${iv('Stat',2)}`,lines:[
    `${iv('code',1)} = ${T_STAT}(${iv('Stat',1)}, ${VF})`,
    `${iv('code',2)} = ${T_STAT}(${iv('Stat',2)}, ${VF})`,
    `${iv('code',1)} ++ ${iv('code',2)}`]},
  {key:'s_assign',pat:`<b>id</b> := ${iv('Exp')}`,lines:[
    `${iv('place')} = ${iv('newvar')}()`,
    `${iv('x')} = ${iv('lookup')}(${iv('vtable')}, ${iv('getname')}(<b>id</b>))`,
    `${T_EXP}(${iv('Exp')}, ${VF}, ${iv('place')}) ++ [${iv('x')} := ${iv('place')}]`]},
  {key:'s_if',pat:`<code>if</code> ${iv('Cond')}<br><code>then</code> ${iv('Stat',1)}`,lines:[
    `${iv('label',1)} = ${iv('newlabel')}()`,
    `${iv('label',2)} = ${iv('newlabel')}()`,

let NID=0;
const mk=o=>{o.id=NID++;return o};
const E_num=v=>mk({k:'e_num',v}),E_id=name=>mk({k:'e_id',name}),E_un=(op,e)=>mk({k:'e_unop',op,e}),
  E_bin=(op,l,r)=>mk({k:'e_binop',op,l,r}),E_call=(f,args)=>mk({k:'e_call',f,args});
const S_seq=(a,b)=>mk({k:'s_seq',a,b}),S_asg=(nm,e)=>mk({k:'s_assign',nm,e}),S_wh=(c,s)=>mk({k:'s_while',c,s}),S_rep=(s,c)=>mk({k:'s_repeat',s,c});
const C_rel=(op,l,r)=>mk({k:'c_rel',op,l,r}),C_and=(a,b)=>mk({k:'c_and',a,b}),C_or=(a,b)=>mk({k:'c_or',a,b}),C_not=c=>mk({k:'c_not',c});
function src(n){
  switch(n.k){
   case 'e_num':return String(n.v);case 'e_id':return n.name;
   case 'e_unop':return n.op+src(n.e);
   case 'e_binop':return src(n.l)+' '+n.op+' '+src(n.r);
   case 'e_call':return n.f+'('+n.args.map(src).join(', ')+')';
   case 'c_rel':return src(n.l)+' '+n.op+' '+src(n.r);
   case 'c_not':return '!('+src(n.c)+')';
   case 'c_and':return '('+src(n.a)+') && ('+src(n.b)+')';
   case 'c_or':return '('+src(n.a)+') || ('+src(n.b)+')';
   case 's_assign':return n.nm+' := '+src(n.e);
   case 's_seq':return src(n.a)+'; '+src(n.b);
   case 's_while':return 'while ('+src(n.c)+') do { '+src(n.s)+' }';
   case 's_repeat':return 'repeat { '+src(n.s)+' } until ('+src(n.c)+')';
  }
  return '?';
}

/* ============================================================
   The engine: runs the textbook recursion and records everything

function codeTxt(lines){return lines.length?'['+lines.map(esc).join(', ')+']':'[ ]'}
function translate(P,start){
  const ast=P.build();
  let tn=start.t,ln=start.l,RID=0;
  const EV=[];
  const nv=()=>'t'+(tn++),nl=()=>'L'+(ln++);
  const vt=P.vt,ft=P.ft;
  const newR=(fn,key,node,desc,params,parent)=>{
    const r={id:RID++,fn,key,node,desc,params,parent,inst:[],children:[],comp:[],code:[],args:null,allocs:[],enterAt:-1,retAt:-1,in:{}};
    if(parent)parent.children.push(r);return r};
  const enter=r=>{r.enterAt=EV.length;EV.push({t:'e',r})};
  const I=(r,txt,kind)=>{r.inst.push({at:EV.length,kind:kind||'plain',pend:txt,done:txt,doneAt:EV.length});};
  const alloc=(r,lhs,val)=>{r.allocs.push(val);I(r,`${lhs} = ${lhs.startsWith('label')||lhs==='arg2'?'newlabel':'newvar'}() = <b>${val}</b>`,'alloc');return val};
  const callLine=(r,lhs,callTxt,fnChild,isPair)=>{
    const e={at:EV.length,kind:'call',pend:`${lhs} = ${callTxt}`,done:null,doneAt:1e9};
    r.inst.push(e);const ch=fnChild();
    e.doneAt=ch.retAt;
    e.done=isPair?`${lhs} = (${codeTxt(ch.code)}, [${ch.args.join(', ')}])`:`${lhs} = ${codeTxt(ch.code)}`;
    e.child=ch;return ch};
  const fin=(r,comp,names)=>{
    r.comp=comp;r.code=[];
    comp.forEach(p=>{if(p.child)r.code.push(...p.child.code);else r.code.push(...p.lines)});
    r.retAt=EV.length+1;EV.push({t:'r',r});
    const txt=comp.map(p=>p.child?esc(p.nm):codeTxt(p.lines)).join(' ++ ');
    r.ret={at:r.retAt,txt,code:r.code,args:r.args};
    if(!r.noRet)r.inst.push({at:r.retAt,kind:'ret',pend:txt,done:txt,doneAt:r.retAt});
    return r};
  const lk=(m,n)=>m[n]===undefined?n:m[n];
  /* ---------- TransExp ---------- */
  function Exp(n,place,parent){
    const r=newR('Exp',n.k,n,src(n),`place = ${place}`,parent);enter(r);
    switch(n.k){
     case 'e_num':
      I(r,`v = getvalue(num) = ${n.v}`);
      return fin(r,[{lines:[`${place} := ${n.v}`]}]);
     case 'e_id':{
      const x=lk(vt,n.name);I(r,`x = lookup(vtable, "${esc(n.name)}") = <b>${x}</b>`);
      return fin(r,[{lines:[`${place} := ${x}`]}]);}
     case 'e_unop':{
      const p1=alloc(r,'place₁',nv());
      const c1=callLine(r,'code₁',`TransExp(${esc(src(n.e))}, vtable, ftable, ${p1})`,()=>Exp(n.e,p1,r));
      I(r,`op = transop("${n.op}") = ${n.op}`);
      return fin(r,[{child:c1,nm:'code₁'},{lines:[`${place} := ${n.op} ${p1}`]}]);}
     case 'e_binop':{
      const p1=alloc(r,'place₁',nv()),p2=alloc(r,'place₂',nv());
      const c1=callLine(r,'code₁',`TransExp(${esc(src(n.l))}, vtable, ftable, ${p1})`,()=>Exp(n.l,p1,r));
      const c2=callLine(r,'code₂',`TransExp(${esc(src(n.r))}, vtable, ftable, ${p2})`,()=>Exp(n.r,p2,r));
      I(r,`op = transop("${n.op}") = ${n.op}`);
      return fin(r,[{child:c1,nm:'code₁'},{child:c2,nm:'code₂'},{lines:[`${place} := ${p1} ${n.op} ${p2}`]}]);}
     case 'e_call':{
      const c1=callLine(r,'(code₁, [a₁,…,aₙ])',`TransExps(${esc(n.args.map(src).join(', '))}, vtable, ftable)`,()=>Exps(n.args,r),true);
      const f=lk(ft,n.f);I(r,`fname = lookup(ftable, "${n.f}") = <b>${f}</b>`);
      return fin(r,[{child:c1,nm:'code₁'},{lines:[`${place} := CALL ${f}(${c1.args.join(', ')})`]}]);}
    }}
  /* ---------- TransExps ---------- */
  function Exps(list,parent){

      r.inst[r.inst.length-1].at=r.retAt;r.inst[r.inst.length-1].doneAt=r.retAt;

    const c2=callLine(r,'(code₂, args)',`TransExps(${esc(list.slice(1).map(src).join(', '))}, vtable, ftable)`,()=>Exps(list.slice(1),r),true);
    const code3=[...c1.code,...c2.code];

     case 's_while':{

      const c2=callLine(r,'code₂',`TransStat(${esc(src(n.s))}, vtable, ftable)`,()=>Stat(n.s,r));
      return fin(r,[{lines:['LABEL '+l1]},{child:c1,nm:'code₁'},{lines:['LABEL '+l2]},{child:c2,nm:'code₂'},{lines:['GOTO '+l1,'LABEL '+l3]}]);}
     case 's_repeat':{
      const l1=alloc(r,'label₁',nl()),l2=alloc(r,'label₂',nl());
      const c1=callLine(r,'code₁',`TransStat(${esc(src(n.s))}, vtable, ftable)`,()=>Stat(n.s,r));
      const c2=callLine(r,'code₂',`TransCond(${esc(src(n.c))}, ${l2}, ${l1}, vtable, ftable)`,()=>Cond(n.c,l2,l1,r));
      return fin(r,[{lines:['LABEL '+l1]},{child:c1,nm:'code₁'},{child:c2,nm:'code₂'},{lines:['LABEL '+l2]}]);}
    }}
  /* ---------- TransCond ---------- */
  function Cond(n,lt,lf,parent){

function runPreset(key,cache){
  cache=cache||{};if(cache[key])return cache[key];

/* ============================================================
   Chapter 9 + inlining: generators and a tiny machine to verify them
   ============================================================ */
const ID_RE=/\b[tuv]\d+\b/g;
function parseIR(line){
  let m;
  if((m=/^(\S+) := CALL (\w+)\((.*)\)$/.exec(line)))return{k:'call',res:m[1],f:m[2],args:m[3].trim()?m[3].split(/\s*,\s*/):[],gen:m[3].trim()?m[3].split(/\s*,\s*/):[],kill:[m[1]]};
  if((m=/^(\S+) := (\S+) ([-+*<>=]+) (\S+)$/.exec(line)))return{k:'bin',gen:[m[2],m[4]].filter(x=>/^[tuv]\d+$/.test(x)),kill:[m[1]]};
  if((m=/^(\S+) := (\S+)$/.exec(line)))return{k:'mov',gen:/^[tuv]\d+$/.test(m[2])?[m[2]]:[],kill:[m[1]]};
  return{k:'other',gen:[],kill:[]};
}
function liveness(code){
  const P=code.map(parseIR),n=code.length,IN=Array(n).fill(0).map(()=>new Set()),OUT=Array(n).fill(0).map(()=>new Set());
  for(let i=n-1;i>=0;i--){
    OUT[i]=i===n-1?new Set():new Set(IN[i+1]);
    const s=new Set(OUT[i]);P[i].kill.forEach(v=>s.delete(v));P[i].gen.forEach(v=>s.add(v));IN[i]=s}
  return code.map((c,i)=>({line:c,p:P[i],gen:P[i].gen,kill:P[i].kill,in:IN[i],out:OUT[i]}));
}
/* ---- Fig 9.4 call sequence ---- */
function callSequence(call,save,retLabel,fname){
  const n=call.args.length,L=[];
  save.forEach((v,i)=>L.push({txt:i===0?`M[SP] := ${v}`:`M[SP+${4*i}] := ${v}`,ph:'save',fig:i===0?'M[SP] := R0':'M[SP+4*k] := Rk'}));
  if(!save.length)L.push({txt:'// nothing is live across this call, so no save lines',ph:'save',fig:'(the R0 … Rk lines are empty: k+1 = 0)',note:true});
  L.push({txt:`SP := SP − ${4*(n+1)}`,ph:'reserve',fig:'SP := SP − 4*(n+1)'});
  call.args.forEach((a,i)=>L.push({txt:`M[SP+${4*(i+1)}] := ${a}`,ph:'args',fig:i===0?'M[SP+4] := a₁':(i===n-1?'M[SP+4*n] := aₙ':'M[SP+4*i] := aᵢ')}));
  L.push({txt:`M[SP] := ${retLabel}`,ph:'ret',fig:'M[SP] := returnaddress'});
  L.push({txt:`GOTO ${fname}`,ph:'goto',fig:'GOTO g'});
  L.push({txt:`LABEL ${retLabel}`,ph:'goto',fig:'LABEL returnaddress'});
  L.push({txt:`${call.res} := M[SP+4]`,ph:'fetch',fig:'x := M[SP+4]'});
  L.push({txt:`SP := SP + ${4*(n+1)}`,ph:'free',fig:'SP := SP + 4*(n+1)'});
  save.forEach((v,i)=>L.push({txt:i===0?`${v} := M[SP]`:`${v} := M[SP+${4*i}]`,ph:'restore',fig:i===0?'R0 := M[SP]':'Rk := M[SP+4*k]'}));
  return L}
function ch9Plan(mainCode,bodyCode,params,retVar,fname,framesize){
  const live=liveness(mainCode),out=[],seqs=[];let c=0;
  const rets=['retA','retB','retC','retD'];
  live.forEach((row,i)=>{
    if(row.p.k==='call'){
      const save=[...row.out].filter(v=>v!==row.p.res).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
      const seq=callSequence(row.p,save,rets[c++],fname);
      seqs.push({i,row,save,seq});seq.forEach(s=>out.push({...s,call:seqs.length}));
    }else out.push({txt:row.line,ph:'plain',call:0});
  });
  const pro=[{txt:`LABEL ${fname}`,fig:'LABEL f'}];
  params.forEach((p,i)=>pro.push({txt:`${p} := M[SP+${4*(i+1)}]`,fig:i===params.length-1&&i>0?'p_m := M[SP+4*m]':'p₁ := M[SP+4]'}));
  pro.push({txt:`SP := SP − ${framesize}`,fig:'SP := SP − framesize_f'});
  const epi=[{txt:`SP := SP + ${framesize}`,fig:'SP := SP + framesize_f'},{txt:`M[SP+4] := ${retVar}`,fig:'M[SP+4] := result'},{txt:'GOTO M[SP]',fig:'GOTO M[SP]'}];
  const mainFinal=out.map(o=>o.txt).filter(t=>!t.startsWith('//'));
  const fFinal=[...pro.map(o=>o.txt),...bodyCode,...epi.map(o=>o.txt)];
  return{live,seqs,out,pro,epi,mainFinal,fFinal};
}
/* ---- inlining ---- */
function inlinePlan(mainCode,bodyCode,params,retVar,fname,startT,startL,startU){
  const out=[];let copy=0,tc=startT,lc=startL,uc=startU;const copies=[];
  mainCode.forEach(line=>{
    const p=parseIR(line);
    if(p.k!=='call'){out.push({txt:line,ph:'plain'});return}
    const map={};
    if(copy>0){
      // fresh names for the 2nd and later copies: labels, parameters, locals, temporaries
      bodyCode.forEach(l=>{(l.match(/\bL\d+\b/g)||[]).forEach(x=>{if(!map[x])map[x]='L'+(lc++)})});
      params.forEach(x=>{map[x]='u'+(uc++)});
      const ts=new Set();bodyCode.forEach(l=>{(l.match(ID_RE)||[]).forEach(x=>{if(!map[x]&&/^[tu]\d+$/.test(x))ts.add(x)})});
      [...ts].sort((a,b)=>(+a.slice(1))-(+b.slice(1))).forEach(x=>{map[x]=x[0]+(x[0]==='t'?tc++:uc++)});
    }
    const R=l=>l.replace(/\b[tuvL]\d+\b/g,x=>map[x]||x);
    const rn=x=>map[x]||x;
    const pieces=[];
    out.push({txt:`// ── inlined copy ${copy+1} of  ${line}`,ph:'head',note:true,copy:copy+1});
    params.forEach((q,i)=>out.push({txt:`${rn(q)} := ${p.args[i]}`,ph:'param',copy:copy+1,orig:`${q} := (argument ${i+1})`}));
    bodyCode.forEach(l=>out.push({txt:R(l),ph:'body',copy:copy+1,orig:l}));
    out.push({txt:`${p.res} := ${rn(retVar)}`,ph:'ret',copy:copy+1,orig:`return ${retVar}`});
    copies.push({map,call:line});copy++;
  });
  return{out,copies,final:out.map(o=>o.txt).filter(t=>!t.startsWith('//'))};
}
/* ---- tiny machine ---- */
function runMachine(code,opts){
  opts=opts||{};const V={},M={};let SP=opts.sp||1000;const lab={};
  code.forEach((l,i)=>{const m=/^LABEL (\S+)$/.exec(l);if(m)lab[m[1]]=i});
  const val=x=>/^-?\d+$/.test(x)?+x:(x in V?V[x]:NaN);
  const addr=s=>{const m=/^M\[SP(?:\+(\d+))?\]$/.exec(s);return m?SP+(m[1]?+m[1]:0):null};
  const ops={'+':(a,b)=>a+b,'-':(a,b)=>a-b,'*':(a,b)=>a*b,'>':(a,b)=>a>b,'<':(a,b)=>a<b,'=':(a,b)=>a===b};
  let pc=0,steps=0;const snap={};
  let last=-1;
  const shot=()=>{if(opts.trace&&last>=0&&snap[last]===null)snap[last]={SP,V:{...V},M:{...M}}};
  while(pc<code.length&&steps++<5000){
    shot();
    const l=code[pc];let m;const cur=pc;last=cur;pc++;
    if(opts.trace&&!(cur in snap)){snap[cur]=null}
    if((m=/^LABEL /.exec(l)))continue;
    if((m=/^GOTO M\[SP\]$/.exec(l))){if(M[SP]===undefined)break;pc=lab[M[SP]];continue}
    if((m=/^GOTO (\S+)$/.exec(l))){if(opts.clobber&&m[1]===opts.fname)(opts.clobber).forEach(v=>V[v]=NaN);pc=lab[m[1]];continue}
    if((m=/^IF (\S+) (\S+) (\S+) THEN (\S+) ELSE (\S+)$/.exec(l))){pc=lab[ops[m[2]](val(m[1]),val(m[3]))?m[4]:m[5]];continue}
    if((m=/^SP := SP ([−-]|\+) (\d+)$/.exec(l))){SP+=(m[1]==='+'?1:-1)*+m[2];continue}
    if((m=/^(M\[SP(?:\+\d+)?\]) := (\S+)$/.exec(l))){M[addr(m[1])]=(m[2] in lab)?m[2]:val(m[2]);continue}
    if((m=/^(\S+) := (M\[SP(?:\+\d+)?\])$/.exec(l))){V[m[1]]=M[addr(m[2])];continue}
    if((m=/^(\S+) := (\S+) ([-+*<>=]) (\S+)$/.exec(l))){V[m[1]]=ops[m[3]](val(m[2]),val(m[4]));continue}
    if((m=/^(\S+) := (\S+)$/.exec(l))){V[m[1]]=val(m[2]);continue}
    throw new Error('cannot run: '+l)}
  shot();
  return{V,M,SP,steps,snap};
}

function tableHTML(r,s,ev,showAll){

    row.lines.forEach((ln,j)=>{

        if(e&&s>=e.at){const txt=s>=e.doneAt?e.done:e.pend;
          const isRet=e.kind==='ret',cur=(ev.t==='e'&&j===pendIdx)||(ev.t==='r'&&isRet&&ev.r===r)||(ev.t==='e'&&ev.r===r&&e.kind==='alloc'&&e.at===ev.r.enterAt+1+0&&false);

/* ---------- tree method ---------- */
function buildTree(R){
  const pre=[],post=[];

  const root=walk(R.root,null);pre.forEach((n,i)=>n.pre=i);post.forEach((n,i)=>n.post=i);return{root,pre,post}}

function inlView(){
  const A=getRun('q2a'),B=getRun('q2b');
  const I=inlinePlan(A.code,B.code,['u1','u2'],'u1','f',B.end.t,B.end.l,3);
  const m2=I.copies[1].map,keys=Object.keys(m2);
  const run=runMachine(I.final,{});
  let h=`<h2>2c.I · Inlining add into MAIN, twice</h2>
<p class="lede">Instead of calling <code>f</code>, paste a copy of its body at each call. No call sequence, no prologue, no epilogue: the call instruction disappears. The test warns that the generated jump-labels need extra re-naming. The lecture's own inlining recipe is not in the material I have, so this follows the textbook's procedure (§9.12.1), which agrees with the test's hint.</p>
<h3>The recipe for one call <code>res := CALL f(a₁, a₂)</code></h3>
<ol class="rules"><li><b>Take a fresh copy</b> of f's translated body (the 2b code).</li>
<li><b>Initialise the parameters from the arguments:</b> <code>u1 := a₁</code>, <code>u2 := a₂</code>.</li>
<li><b>Paste the body</b> after them.</li>
<li><b>Turn <code>return x</code> into an assignment</b> to the call's result: <code>res := u1</code> (no jump needed: the return is the last thing in add).</li>
<li><b>Rename</b> everything in the second copy that would clash with the first: jump-labels (<b>essential</b>) and the parameters and temporaries (what the textbook asks for, to avoid variable capture).</li></ol>
<h3>What the renaming looks like for copy 2</h3>
<div class="scroll"><table class="t"><tr><th>kind</th><th>in copy 1 (unchanged)</th><th>in copy 2</th></tr>
<tr><td>labels</td><td>L0, L1, L2</td><td>${['L0','L1','L2'].map(k=>m2[k]).join(', ')}</td></tr>
<tr><td>parameters</td><td>u1, u2</td><td>${m2.u1}, ${m2.u2}</td></tr>
<tr><td>temporaries</td><td>t5 … t12</td><td>${['t5','t6','t7','t8','t9','t10','t11','t12'].map(k=>m2[k]).join(', ')}</td></tr></table></div>
<div class="box warn"><b>Why the labels matter most.</b> Both copies would otherwise contain <code>LABEL L0</code>, <code>LABEL L1</code>, <code>LABEL L2</code>. A <code>GOTO L0</code> would then have two possible targets. That ambiguity is the "confusion" the test warns about. Variables are safer: the copies run one after the other and each initialises its own parameters first, but renaming them is what the textbook procedure prescribes. If you are short of time, labels first.<br>The reason MAIN's variables (<code>t0…t4, u0</code>) never clash with add's (<code>u1,u2,t5…</code>) is the continuing counters from 2a to 2b.</div>
<h3>The final MAIN, with the origin of every line</h3>
${colorCode(I.out,o=>o.ph==='plain'?'':o.note?'ph-go':o.copy===1?'ph-save':'ph-arg')}
<div class="legend"><span><span class="swatch ph-save"></span>copy 1 (call 1)</span><span><span class="swatch ph-arg"></span>copy 2 (call 2)</span></div>
<p class="tag">The lines starting <code>//</code> are only markers for you; leave them out or keep them as comments.</p>
<div class="box ok"><b>Check by running it:</b> the inlined MAIN above executes to <b>u0 = ${run.V.u0}</b> (= add(3, add(4,5)) = 12), with no <code>CALL</code> left.</div>
<h3>Inlining versus the call sequence</h3>
<table class="ref"><tr><th></th><th>call sequence (2c.II)</th><th>inlining (2c.I)</th></tr>
<tr><td>run time</td><td>pays for the frame, saves, jump and return</td><td>no call overhead</td></tr>
<tr><td>code size</td><td>one copy of add</td><td>a copy of add per call</td></tr>
<tr><td>things to watch</td><td>which variables to save; return labels</td><td>renaming labels and variables; recursion cannot be inlined indefinitely</td></tr></table>`;
  return h}

  <div class="ctl"><label>Program: <select onchange="S.prac=this.value;draw()">${['x1','x2','q2a','q2b'].map(k=>`<option value="${k}" ${S.prac===k?'selected':''}>${esc(PRESETS[k].short)}</option>`).join('')}</select></label></div>
  <div class="box"><code>${esc(PRESETS[S.prac].code)}</code><div class="tag">symbol table ${esc(JSON.stringify(PRESETS[S.prac].vt))}${PRESETS[S.prac].after?' · counters continue from 2a':''}</div></div><div id="tv"></div>`}

function cribView(){
  const A=getRun('q2a'),B=getRun('q2b');
  return `<h2>Crib-book summary</h2><p class="lede">What to copy into the booklet for Chapters 6 and 9. The tables are in stage 1; this is the working method and the answers to the sample.</p>
<h3>Chapter 6 method (either style)</h3>
<ol class="rules"><li>Choose the function by the node: expression → <i>TransExp</i> (needs a place), statement → <i>TransStat</i>, condition → <i>TransCond</i> (needs <i>label<sub>t</sub></i>, <i>label<sub>f</sub></i>).</li>
<li>On entering a node, create its fresh names <b>first</b> (top lines of the row), then recurse.</li>
<li>Binop: both places before either operand. Arguments: one place right before each argument. Assignment: fresh temp, then <code>x := temp</code>.</li>
<li>Code is assembled afterwards, as the row's last line says.</li>
<li>Counter order decides the numbers: t0/L0 first, continued from MAIN into the function.</li></ol>
<h3>Answers to Task 2</h3>
<div class="row"><div class="col"><div class="tag">2a · MAIN</div><pre class="code">${A.code.map(esc).join('\n')}</pre><div class="tag">2b · while-loop</div><pre class="code">${B.code.map(esc).join('\n')}</pre></div>
<div class="col"><div class="tag">2c.II · MAIN with call sequences</div><pre class="code">${c9Data().plan.mainFinal.map(esc).join('\n')}</pre></div></div>
<div class="row"><div class="col"><div class="tag">2c.II · add with prologue/epilogue (framesize = 0)</div><pre class="code">${c9Data().plan.fFinal.map(esc).join('\n')}</pre></div>
<div class="col"><div class="tag">2c.I · MAIN with add inlined twice</div><pre class="code">${inlinePlan(A.code,B.code,['u1','u2'],'u1','f',B.end.t,B.end.l,3).final.map(esc).join('\n')}</pre></div></div>
<h3>Chapter 9 formulas</h3>
<ul class="rules"><li>Frame for a call with n arguments: <code>4·(n+1)</code> bytes; <code>M[SP]</code> = return address, <code>M[SP+4i]</code> = argument i; result returns in <code>M[SP+4]</code>.</li>
<li>Call sequence: save live values → <code>SP := SP − 4(n+1)</code> → arguments → <code>M[SP] := ret</code> → <code>GOTO f</code> → <code>LABEL ret</code> → <code>x := M[SP+4]</code> → <code>SP := SP + 4(n+1)</code> → restore.</li>
<li>Prologue: <code>LABEL f; pᵢ := M[SP+4i]; SP := SP − framesize</code>. Epilogue: <code>SP := SP + framesize; M[SP+4] := result; GOTO M[SP]</code>.</li>
<li>Save set = <code>out[call]</code> minus the call's result.</li></ul>
<div class="box warn"><b>Things I could not confirm from your material:</b> the lecturer's exact inlining recipe, whether the marker counts saved registers as the book's R0…Rk or only live variables, and whether framesize is written symbolically or as a number. The answers above follow the textbook where the lecture is silent. Worth a quick check with the lecturer or tutors.</div>`}

function draw(){
  const nav=STAGES.map((s,i)=>`<a class="${i===S.stage?'on':''}" onclick="go(${i})"><b>${s.n}</b>${s.t}</a>`).join('');
  $('nav').innerHTML=nav;
  const id=STAGES[S.stage].id;let h='';
  if(id==='intro')h=introView();
  else if(id==='tables')h=tablesView();
  else if(id==='q2a')h=transStage('q2a','2a · Intermediate code for MAIN',`<code>result := add( 3 , add( 4 , 5 ) );</code>. Two calls, so two <code>CALL</code> instructions. Watch how the argument places are created one at a time, and how the inner call's result lands in a place the outer call then uses.`);
  else if(id==='q2b')h=transStage('q2b','2b · The while-loop inside add',`<code>while ( y &gt; 0 ) do { x := x + 1 ; y := y − 1 ; }</code>. The counters carry on from 2a (t5 and L0 next), as in the lecturer's solution. The <code>return x</code> is not translated here.`);
  else if(id==='c9')h=c9View();
  else if(id==='inl')h=inlView();
  else if(id==='prac')h=pracView();
  else if(id==='source')h=sourceView();
  else h=cribView();
  $('main').innerHTML=h;
  const tv=$('#tv');
  if(tv){const key=id==='prac'?S.prac:id;transView(key,tv)}
}
window.go=i=>{S.stage=i;draw();window.scrollTo(0,0)};
document.addEventListener('keydown',e=>{
  if(['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName)&&e.target.type!=='range')return;
  const id=STAGES[S.stage].id;if(e.key!=='ArrowRight'&&e.key!=='ArrowLeft')return;const d=e.key==='ArrowRight'?1:-1;
  if(id==='q2a'||id==='q2b'||id==='prac')stp(id==='prac'?S.prac:id,d);else if(id==='c9')c9s(d)});
window.toggleTheme=()=>{const r=document.documentElement;const dark=r.dataset.theme==='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);r.dataset.theme=dark?'light':'dark'};
draw();

</script></body></html>
